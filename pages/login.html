<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="تسجيل الدخول إلى منصة Nova Future التعليمية."
>

<title>تسجيل الدخول - Nova Future</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<style>

    /* =========================================
       LOGIN PAGE
       نفس هوية صفحة الطالب
    ========================================= */

    .auth-page {
        min-height: 100vh;

        display: flex;
        flex-direction: column;

        background:
            radial-gradient(
                circle at 10% 0%,
                rgba(37, 99, 235, 0.15),
                transparent 28%
            ),
            radial-gradient(
                circle at 90% 10%,
                rgba(37, 99, 235, 0.10),
                transparent 25%
            ),
            linear-gradient(
                180deg,
                #0b1220 0%,
                #0f172a 55%,
                #0b1220 100%
            );
    }

    /* =========================================
       HEADER
    ========================================= */

    .auth-header {
        position: sticky;
        top: 0;
        z-index: 1000;

        padding: 12px 20px;

        background:
            linear-gradient(
                180deg,
                rgba(10, 17, 30, 0.97),
                rgba(15, 23, 42, 0.94)
            );

        border-bottom:
            1px solid rgba(96, 165, 250, 0.12);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }

    .auth-header-inner {
        width: min(1050px, 100%);

        min-height: 54px;

        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 15px;
    }

    .auth-brand {
        display: inline-flex;
        align-items: center;

        gap: 10px;

        color: #ffffff;

        font-size: 19px;
        font-weight: 900;

        text-decoration: none;
    }

    .auth-brand:hover {
        color: #ffffff;
    }

    .auth-brand-icon {
        width: 44px;
        height: 44px;

        display: grid;
        place-items: center;

        border-radius: 14px;

        background:
            linear-gradient(
                145deg,
                #3b82f6,
                #1d4ed8
            );

        color: #ffffff;

        box-shadow:
            0 8px 24px rgba(37, 99, 235, 0.28);
    }

    .auth-brand-text {
        display: flex;
        flex-direction: column;

        line-height: 1.15;
    }

    .auth-brand-text strong {
        color: #ffffff;

        font-size: 17px;
        font-weight: 1000;
    }

    .auth-brand-text small {
        margin-top: 2px;

        color: #64748b;

        font-size: 8px;
        letter-spacing: 1px;
    }

    .home-link {
        min-height: 40px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 8px 14px;

        border-radius: 11px;

        color: #cbd5e1;

        background:
            rgba(37, 99, 235, 0.06);

        border:
            1px solid rgba(96, 165, 250, 0.12);

        font-size: 13px;
        font-weight: 800;

        text-decoration: none;

        transition:
            background .25s ease,
            color .25s ease,
            border-color .25s ease,
            transform .25s ease;
    }

    .home-link:hover {
        color: #ffffff;

        background:
            rgba(37, 99, 235, 0.14);

        border-color:
            rgba(96, 165, 250, 0.28);

        transform:
            translateY(-1px);
    }

    /* =========================================
       MAIN
    ========================================= */

    .auth-main {
        flex: 1;

        width: min(100%, 540px);

        margin: 0 auto;

        padding: 55px 20px 45px;

        display: flex;
        align-items: center;
    }

    /* =========================================
       AUTH CARD
    ========================================= */

    .auth-card {
        position: relative;

        width: 100%;

        padding: 38px 32px;

        background:
            linear-gradient(
                145deg,
                rgba(17, 27, 46, 0.98),
                rgba(11, 18, 32, 0.98)
            );

        border:
            1px solid rgba(96, 165, 250, 0.18);

        border-radius: 24px;

        box-shadow:
            0 22px 55px rgba(0, 0, 0, 0.35);

        overflow: hidden;

        animation:
            authFadeUp .5s ease both;
    }

    .auth-card::before {
        content: "";

        position: absolute;

        top: 0;
        right: 0;
        left: 0;

        height: 3px;

        background:
            linear-gradient(
                90deg,
                transparent,
                #3b82f6,
                #60a5fa,
                #3b82f6,
                transparent
            );
    }

    .auth-card::after {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        top: -120px;
        left: -80px;

        border-radius: 50%;

        background:
            rgba(37, 99, 235, 0.07);

        pointer-events: none;
    }

    /* =========================================
       AUTH ICON
    ========================================= */

    .auth-icon {
        position: relative;
        z-index: 1;

        width: 70px;
        height: 70px;

        margin: 0 auto 18px;

        display: grid;
        place-items: center;

        border-radius: 21px;

        background:
            rgba(37, 99, 235, 0.12);

        border:
            1px solid rgba(96, 165, 250, 0.20);

        box-shadow:
            0 10px 30px rgba(37, 99, 235, 0.10);

        font-size: 31px;
    }

    /* =========================================
       TITLE
    ========================================= */

    .auth-title {
        position: relative;
        z-index: 1;

        text-align: center;

        margin-bottom: 8px;
    }

    .auth-title h1 {
        margin-bottom: 7px;

        color: #ffffff;

        font-size: 28px;
        font-weight: 1000;
    }

    .auth-title p {
        margin: 0;

        color: #94a3b8;

        font-size: 13px;
    }

    /* =========================================
       FORM
    ========================================= */

    .login-form {
        position: relative;
        z-index: 1;

        margin-top: 28px;
    }

    .field-group {
        margin-bottom: 17px;
    }

    .field-label {
        display: flex;
        align-items: center;

        gap: 6px;

        margin-bottom: 8px;

        color: #e2e8f0;

        font-size: 13px;
        font-weight: 800;
    }

    .field-input-wrapper {
        position: relative;
    }

    .field-icon {
        position: absolute;

        top: 50%;
        right: 14px;

        transform:
            translateY(-50%);

        color: #64748b;

        font-size: 16px;

        pointer-events: none;

        transition:
            color .25s ease;
    }

    .field-input-wrapper:focus-within .field-icon {
        color: #60a5fa;
    }

    .field-input {
        width: 100%;

        min-height: 51px;

        margin: 0;

        padding:
            13px 43px 13px 15px;

        background:
            #0b1424;

        border:
            1px solid rgba(96, 165, 250, 0.17);

        border-radius: 13px;

        color: #f8fafc;

        outline: none;

        transition:
            border-color .25s ease,
            box-shadow .25s ease,
            background .25s ease;
    }

    .field-input::placeholder {
        color: #64748b;
    }

    .field-input:focus {
        background:
            #0d1728;

        border-color:
            #3b82f6;

        box-shadow:
            0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .password-input {
        padding-left: 50px;
    }

    /* =========================================
       PASSWORD TOGGLE
    ========================================= */

    .password-toggle {
        position: absolute;

        top: 50%;
        left: 7px;

        transform:
            translateY(-50%);

        width: 39px;
        height: 39px;

        min-height: 39px;

        display: grid;
        place-items: center;

        padding: 0;
        margin: 0;

        border: 0;
        border-radius: 10px;

        background: transparent;

        color: #64748b;

        font-size: 16px;

        box-shadow: none;

        transition:
            background .2s ease,
            color .2s ease;
    }

    .password-toggle:hover {
        transform:
            translateY(-50%);

        background:
            rgba(37, 99, 235, 0.12);

        color: #60a5fa;

        box-shadow: none;
    }

    /* =========================================
       MESSAGE
    ========================================= */

    .login-message {
        display: none;

        margin: 0 0 17px;

        padding: 12px 14px;

        border-radius: 12px;

        font-size: 13px;
        font-weight: 700;

        line-height: 1.7;

        text-align: right;

        border: 1px solid transparent;
    }

    .login-message.show {
        display: block;

        animation:
            messageAppear .25s ease both;
    }

    .login-message.error {
        color: #fca5a5;

        background:
            rgba(239, 68, 68, 0.10);

        border-color:
            rgba(239, 68, 68, 0.20);
    }

    .login-message.info {
        color: #7dd3fc;

        background:
            rgba(56, 189, 248, 0.10);

        border-color:
            rgba(56, 189, 248, 0.20);
    }

    .login-message.success {
        color: #86efac;

        background:
            rgba(34, 197, 94, 0.10);

        border-color:
            rgba(34, 197, 94, 0.20);
    }

    /* =========================================
       SUBMIT
    ========================================= */

    .login-submit {
        width: 100%;

        min-height: 52px;

        margin-top: 4px;

        border: 0;
        border-radius: 13px;

        background:
            linear-gradient(
                135deg,
                #3b82f6,
                #1d4ed8
            );

        color: #ffffff;

        font-size: 15px;
        font-weight: 900;

        box-shadow:
            0 10px 27px rgba(37, 99, 235, 0.25);

        transition:
            transform .25s ease,
            box-shadow .25s ease,
            opacity .25s ease;
    }

    .login-submit:hover {
        transform:
            translateY(-2px);

        box-shadow:
            0 15px 35px rgba(37, 99, 235, 0.35);
    }

    .login-submit:active {
        transform:
            translateY(0);
    }

    .login-submit.loading {
        pointer-events: none;
        opacity: .75;
    }

    .button-spinner {
        display: none;

        width: 19px;
        height: 19px;

        border:
            3px solid rgba(255, 255, 255, .30);

        border-top-color:
            #ffffff;

        border-radius: 50%;

        animation:
            loginSpin .75s linear infinite;
    }

    .login-submit.loading .button-spinner {
        display: inline-block;
    }

    .login-submit.loading .button-text {
        display: none;
    }

    /* =========================================
       LINKS
    ========================================= */

    .auth-links {
        position: relative;
        z-index: 1;

        margin-top: 23px;
        padding-top: 20px;

        border-top:
            1px solid rgba(96, 165, 250, 0.10);

        text-align: center;
    }

    .register-text {
        margin-bottom: 12px;

        color: #94a3b8;

        font-size: 13px;
    }

    .register-link {
        color: #60a5fa;

        font-weight: 900;

        text-decoration: none;
    }

    .register-link:hover {
        color: #93c5fd;
    }

    .back-link {
        display: inline-flex;
        align-items: center;

        gap: 5px;

        color: #64748b;

        font-size: 12px;
        font-weight: 700;

        text-decoration: none;

        transition: color .2s ease;
    }

    .back-link:hover {
        color: #60a5fa;
    }

    /* =========================================
       FOOTER
    ========================================= */

    .auth-footer {
        padding: 22px 20px;

        text-align: center;

        color: #475569;

        font-size: 12px;

        border-top:
            1px solid rgba(96, 165, 250, 0.07);

        background:
            rgba(7, 13, 24, 0.55);
    }

    /* =========================================
       ANIMATIONS
    ========================================= */

    @keyframes authFadeUp {

        from {
            opacity: 0;

            transform:
                translateY(18px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0);
        }
    }

    @keyframes messageAppear {

        from {
            opacity: 0;

            transform:
                translateY(-5px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0);
        }
    }

    @keyframes loginSpin {

        from {
            transform:
                rotate(0deg);
        }

        to {
            transform:
                rotate(360deg);
        }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

        .auth-header {
            padding: 10px 13px;
        }

        .auth-header-inner {
            min-height: 50px;
        }

        .auth-brand {
            font-size: 17px;
        }

        .auth-brand-icon {
            width: 40px;
            height: 40px;

            border-radius: 13px;
        }

        .auth-brand-text small {
            display: none;
        }

        .home-link {
            min-height: 38px;

            padding:
                7px 10px;

            font-size: 11px;
        }

        .auth-main {
            width: 100%;

            padding:
                30px 13px 35px;
        }

        .auth-card {
            padding:
                32px 20px;

            border-radius:
                21px;
        }

        .auth-icon {
            width: 63px;
            height: 63px;

            border-radius: 19px;

            font-size: 28px;
        }

        .auth-title h1 {
            font-size: 25px;
        }

        .auth-title p {
            font-size: 12px;
        }

        .field-input {
            min-height: 49px;
        }

        .login-submit {
            min-height: 50px;
        }
    }

</style>

</head><body class="auth-page"><!-- =========================================
     HEADER
========================================= -->

<header class="auth-header">

    <div class="auth-header-inner">

        <a
            href="../index.html"
            class="auth-brand"
            aria-label="Nova Future"
        >

            <span class="auth-brand-icon">
                🚀
            </span>

            <span class="auth-brand-text">

                <strong>
                    NOVA FUTURE
                </strong>

                <small>
                    LEARN TODAY · SHAPE TOMORROW
                </small>

            </span>

        </a>

        <a
            href="../index.html"
            class="home-link"
        >
            ← الرئيسية
        </a>

    </div>

</header>


<!-- =========================================
     MAIN
========================================= -->

<main class="auth-main">

    <section class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <div class="auth-title">

            <h1>
                مرحبًا بعودتك 👋
            </h1>

            <p>
                سجّل دخولك للوصول إلى حسابك
            </p>

        </div>


        <form
            id="loginForm"
            class="login-form"
            onsubmit="loginUser(event)"
        >

            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="login-message"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- EMAIL -->

            <div class="field-group">

                <label
                    class="field-label"
                    for="email"
                >
                    📧 البريد الإلكتروني
                </label>

                <div class="field-input-wrapper">

                    <span class="field-icon">
                        ✉️
                    </span>

                    <input
                        class="field-input"
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="field-group">

                <label
                    class="field-label"
                    for="password"
                >
                    🔑 كلمة المرور
                </label>

                <div class="field-input-wrapper">

                    <span class="field-icon">
                        🔒
                    </span>

                    <input
                        class="field-input password-input"
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="passwordToggle"
                        class="password-toggle"
                        aria-label="إظهار كلمة المرور"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="loginButton"
                class="login-submit"
            >

                <span class="button-text">
                    تسجيل الدخول
                </span>

                <span
                    class="button-spinner"
                    aria-hidden="true"
                ></span>

            </button>

        </form>


        <!-- LINKS -->

        <div class="auth-links">

            <p class="register-text">

                ليس لديك حساب؟

                <a
                    href="register.html"
                    class="register-link"
                >
                    إنشاء حساب جديد
                </a>

            </p>

            <a
                href="../index.html"
                class="back-link"
            >
                ← العودة إلى الصفحة الرئيسية
            </a>

        </div>

    </section>

</main>


<!-- =========================================
     FOOTER
========================================= -->

<footer class="auth-footer">

    © 2026 Nova Future — جميع الحقوق محفوظة

</footer>


<!-- =========================================
     FIREBASE LOGIN
========================================= -->

<script type="module">

    import {
        signInWithEmailAndPassword
    } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
        doc,
        getDoc
    } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    import {
        auth,
        db
    } from
        "../js/firebase-config.js";


    /* =========================================
       ELEMENTS
    ========================================= */

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const passwordToggle =
        document.getElementById("passwordToggle");


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(
        message,
        type = "error"
    ) {

        loginMessage.textContent =
            message;

        loginMessage.className =
            "login-message show " + type;
    }


    function clearMessage() {

        loginMessage.textContent =
            "";

        loginMessage.className =
            "login-message";
    }


    /* =========================================
       LOADING
    ========================================= */

    function setLoading(
        isLoading
    ) {

        if (isLoading) {

            loginButton.classList.add(
                "loading"
            );

            loginButton.disabled =
                true;

            emailInput.disabled =
                true;

            passwordInput.disabled =
                true;

        } else {

            loginButton.classList.remove(
                "loading"
            );

            loginButton.disabled =
                false;

            emailInput.disabled =
                false;

            passwordInput.disabled =
                false;

        }

    }


    /* =========================================
       PASSWORD VISIBILITY
    ========================================= */

    passwordToggle.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type ===
                "password";

            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";

            passwordToggle.textContent =
                isPassword
                    ? "🙈"
                    : "👁️";

            passwordToggle.setAttribute(
                "aria-label",
                isPassword
                    ? "إخفاء كلمة المرور"
                    : "إظهار كلمة المرور"
            );

        }
    );


    /* =========================================
       LOGIN
    ========================================= */

    window.loginUser =
        async function (event) {

            event.preventDefault();

            clearMessage();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (
                !email ||
                !password
            ) {

                showMessage(
                    "من فضلك أدخل البريد الإلكتروني وكلمة المرور."
                );

                return;
            }


            setLoading(true);


            try {

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                const userDoc =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        )
                    );


                if (!userDoc.exists()) {

                    showMessage(
                        "تم تسجيل الدخول، لكن بيانات الحساب غير موجودة. تواصل مع إدارة المنصة."
                    );

                    setLoading(false);

                    return;
                }


                const userData =
                    userDoc.data();


                if (
                    userData.role ===
                    "student"
                ) {

                    window.location.href =
                        "student.html";

                    return;
                }


                if (
                    userData.role ===
                    "teacher"
                ) {

                    window.location.href =
                        "teacher.html";

                    return;
                }


                if (
                    userData.role ===
                    "admin"
                ) {

                    window.location.href =
                        "admin.html";

                    return;
                }


                showMessage(
                    "نوع الحساب غير معروف. تواصل مع إدارة المنصة."
                );

                setLoading(false);

            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                let message =
                    "تعذر تسجيل الدخول. تأكد من بياناتك وحاول مرة أخرى.";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    message =
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

                } else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    message =
                        "لا يوجد حساب بهذا البريد الإلكتروني.";

                } else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    message =
                        "كلمة المرور غير صحيحة.";

                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message =
                        "البريد الإلكتروني غير صحيح.";

                } else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    message =
                        "تمت محاولات تسجيل دخول كثيرة. حاول مرة أخرى بعد قليل.";
                }


                showMessage(
                    message,
                    "error"
                );

                setLoading(false);
            }

        };


    /* =========================================
       CLEAR ERROR WHEN USER TYPES
    ========================================= */

    emailInput.addEventListener(
        "input",
        clearMessage
    );

    passwordInput.addEventListener(
        "input",
        clearMessage
    );

</script>


<!-- GLOBAL APP -->

<script src="../js/app.js"></script>

</body></html>
