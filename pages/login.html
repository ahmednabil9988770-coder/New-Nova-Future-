<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Nova Future</title>

    <link rel="stylesheet" href="../css/style.css">

    <script type="module">
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { auth } from "../js/firebase-config.js";

        window.loginUser = async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);

                alert("تم تسجيل الدخول بنجاح ✅");

                window.location.href = "student.html";

            } catch (error) {
                alert("بيانات تسجيل الدخول غير صحيحة ❌");
            }
        };
    </script>
</head>

<body>

    <header>
        <h1>Nova Future</h1>
        <p>تسجيل الدخول</p>
    </header>

    <main>
        <section>
            <h2>مرحبًا بعودتك 👋</h2>

            <form onsubmit="loginUser(event)">
                <input
                    type="email"
                    id="email"
                    placeholder="البريد الإلكتروني"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="كلمة المرور"
                    required
                >

                <button type="submit">تسجيل الدخول</button>
            </form>

            <p>
                ليس لديك حساب؟
                <a href="register.html">إنشاء حساب</a>
            </p>

            <a href="../index.html">العودة للرئيسية</a>
        </section>
    </main>

    <script src="../js/app.js"></script>

</body>
</html>
