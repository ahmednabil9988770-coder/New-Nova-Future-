<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة الطالب - Nova Future</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .dashboard {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .top-bar {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .top-bar h2 {
            margin: 0;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .card {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .card h3 {
            margin-bottom: 20px;
        }

        .item {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .item h4 {
            margin-bottom: 8px;
        }

        .item p {
            margin-bottom: 10px;
        }

        .item button {
            border: none;
            background: #222;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .question {
            border: 1px solid #e5e7eb;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: right;
        }

        .question h4 {
            margin-bottom: 15px;
        }

        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            background: #f5f7fb;
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: #16a34a;
            color: white;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
        }

        .result {
            text-align: center;
            font-size: 22px;
            padding: 25px;
            background: #f0fdf4;
            border-radius: 12px;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 20px;
        }
    </style>

    <script type="module">
        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            doc,
            getDoc,
            collection,
            getDocs,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        import { auth, db } from "../js/firebase-config.js";


        // =========================
        // تسجيل الخروج
        // =========================

        window.logoutStudent = async function() {
            await signOut(auth);
            window.location.href = "login.html";
        };


        // =========================
        // تحميل الكورسات
        // =========================

        async function loadCourses() {

            const coursesList = document.getElementById("coursesList");

            coursesList.innerHTML = "";

            try {

                const snapshot = await getDocs(
                    collection(db, "courses")
                );

                if (snapshot.empty) {
                    coursesList.innerHTML =
                        '<p class="empty">لا توجد كورسات حاليًا.</p>';
                    return;
                }

                snapshot.forEach((courseDoc) => {

                    const course = courseDoc.data();

                    const div = document.createElement("div");

                    div.className = "item";

                    div.innerHTML = `
                        <h4>${course.name || "بدون اسم"}</h4>
                        <p>${course.description || "لا يوجد وصف للكورس."}</p>
                    `;

                    coursesList.appendChild(div);
                });

            } catch (error) {

                console.error(error);

                coursesList.innerHTML =
                    '<p class="empty">حدث خطأ أثناء تحميل الكورسات.</p>';
            }
        }


        // =========================
        // تحميل الدروس
        // =========================

        async function loadLessons() {

            const lessonsList = document.getElementById("lessonsList");

            lessonsList.innerHTML = "";

            try {

                const snapshot = await getDocs(
                    collection(db, "lessons")
                );

                if (snapshot.empty) {
                    lessonsList.innerHTML =
                        '<p class="empty">لا توجد دروس حاليًا.</p>';
                    return;
                }

                snapshot.forEach((lessonDoc) => {

                    const lesson = lessonDoc.data();

                    const div = document.createElement("div");

                    div.className = "item";

                    div.innerHTML = `
                        <h4>${lesson.title || "درس بدون عنوان"}</h4>
                        <p><strong>الكورس:</strong> ${lesson.courseName || "غير محدد"}</p>
                        <p>${lesson.content || ""}</p>
                    `;

                    lessonsList.appendChild(div);
                });

            } catch (error) {

                console.error(error);

                lessonsList.innerHTML =
                    '<p class="empty">حدث خطأ أثناء تحميل الدروس.</p>';
            }
        }


        // =========================
        // تحميل الامتحانات
        // =========================

        async function loadExams() {

            const examsList = document.getElementById("examsList");

            examsList.innerHTML = "";

            try {

                const snapshot = await getDocs(
                    collection(db, "exams")
                );

                if (snapshot.empty) {

                    examsList.innerHTML =
                        '<p class="empty">لا توجد امتحانات حاليًا.</p>';

                    return;
                }

                snapshot.forEach((examDoc) => {

                    const exam = examDoc.data();

                    const div = document.createElement("div");

                    div.className = "item";

                    const questionsCount =
                        Array.isArray(exam.questions)
                            ? exam.questions.length
                            : 0;

                    div.innerHTML = `
                        <h4>${exam.title || "امتحان بدون عنوان"}</h4>

                        <p>
                            ${exam.description || "لا يوجد وصف للامتحان."}
                        </p>

                        <p>
                            عدد الأسئلة: ${questionsCount}
                        </p>

                        <button onclick='startExam(
                            "${examDoc.id}",
                            ${JSON.stringify(exam).replace(/'/g, "&apos;")}
                        )'>
                            بدء الامتحان 📝
                        </button>
                    `;

                    examsList.appendChild(div);
                });

            } catch (error) {

                console.error(error);

                examsList.innerHTML =
                    '<p class="empty">حدث خطأ أثناء تحميل الامتحانات.</p>';
            }
        }


        // =========================
        // بدء الامتحان
        // =========================

        window.startExam = function(examId, examData) {

            const examArea =
                document.getElementById("examArea");

            const examTitle =
                document.getElementById("examTitle");

            const questionsContainer =
                document.getElementById("questionsContainer");

            const resultArea =
                document.getElementById("resultArea");

            resultArea.style.display = "none";

            examArea.style.display = "block";

            examTitle.textContent =
                examData.title || "الامتحان";

            questionsContainer.innerHTML = "";

            const questions =
                Array.isArray(examData.questions)
                    ? examData.questions
                    : [];

            if (questions.length === 0) {

                questionsContainer.innerHTML =
                    '<p class="empty">هذا الامتحان لا يحتوي على أسئلة.</p>';

                return;
            }

            questions.forEach((question, index) => {

                const questionDiv =
                    document.createElement("div");

                questionDiv.className = "question";

                questionDiv.innerHTML = `
                    <h4>
                        ${index + 1}. ${question.question}
                    </h4>
                `;

                if (Array.isArray(question.options)) {

                    question.options.forEach(
                        (option, optionIndex) => {

                            const label =
                                document.createElement("label");

                            label.className = "option";

                            label.innerHTML = `
                                <input
                                    type="radio"
                                    name="question_${index}"
                                    value="${optionIndex}"
                                >

                                ${option}
                            `;

                            questionDiv.appendChild(label);
                        }
                    );
                }

                questionsContainer.appendChild(questionDiv);
            });

            window.currentExamId = examId;
            window.currentQuestions = questions;

            examArea.scrollIntoView({
                behavior: "smooth"
            });
        };


        // =========================
        // تسليم الامتحان
        // =========================

        window.submitExam = async function() {

            const examId =
                window.currentExamId;

            const questions =
                window.currentQuestions;

            if (!examId || !questions) {
                return;
            }

            let score = 0;

            let answered = 0;

            questions.forEach((question, index) => {

                const selected =
                    document.querySelector(
                        `input[name="question_${index}"]:checked`
                    );

                if (selected) {

                    answered++;

                    if (
                        Number(selected.value) ===
                        Number(question.correctAnswer)
                    ) {
                        score++;
                    }
                }
            });


            const total = questions.length;


            if (answered < total) {

                alert(
                    "من فضلك أجب عن جميع الأسئلة قبل تسليم الامتحان."
                );

                return;
            }


            const percentage =
                Math.round((score / total) * 100);


            try {

                await addDoc(
                    collection(db, "results"),
                    {
                        studentId: auth.currentUser.uid,
                        examId: examId,
                        score: score,
                        total: total,
                        percentage: percentage,
                        createdAt: serverTimestamp()
                    }
                );


                document.getElementById("examArea")
                    .style.display = "none";


                const resultArea =
                    document.getElementById("resultArea");

                resultArea.style.display = "block";


                document.getElementById("resultText")
                    .textContent =
                    `حصلت على ${score} من ${total} (${percentage}%) 🎉`;


                resultArea.scrollIntoView({
                    behavior: "smooth"
                });


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء حفظ النتيجة ❌"
                );
            }
        };


        // =========================
        // التحقق من الحساب
        // =========================

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href = "login.html";

                return;
            }

            try {

                const userDoc =
                    await getDoc(
                        doc(db, "users", user.uid)
                    );

                if (!userDoc.exists()) {

                    await signOut(auth);

                    window.location.href = "login.html";

                    return;
                }

                const userData =
                    userDoc.data();


                if (userData.role !== "student") {

                    if (userData.role === "admin") {

                        window.location.href = "admin.html";

                    } else if (userData.role === "teacher") {

                        window.location.href = "teacher.html";

                    } else {

                        await signOut(auth);

                        window.location.href = "login.html";
                    }

                    return;
                }


                document.getElementById("studentName")
                    .textContent =
                    userData.name || "الطالب";


                await loadCourses();

                await loadLessons();

                await loadExams();

            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء تحميل بيانات الطالب."
                );
            }
        });

    </script>
</head>


<body>

    <header>
        <h1>Nova Future 🚀</h1>
        <p>لوحة الطالب</p>
    </header>


    <main class="dashboard">

        <!-- الشريط العلوي -->

        <div class="top-bar">

            <div>
                <h2>
                    أهلاً بك يا
                    <span id="studentName">...</span> 👋
                </h2>

                <p>
                    نتمنى لك رحلة تعليمية ممتعة ومميزة.
                </p>
            </div>

            <button
                class="logout-btn"
                onclick="logoutStudent()"
            >
                تسجيل الخروج
            </button>

        </div>


        <!-- الكورسات -->

        <div class="card">

            <h3>📚 الكورسات</h3>

            <div id="coursesList">
                <p class="empty">جاري تحميل الكورسات...</p>
            </div>

        </div>


        <!-- الدروس -->

        <div class="card">

            <h3>📖 الدروس</h3>

            <div id="lessonsList">
                <p class="empty">جاري تحميل الدروس...</p>
            </div>

        </div>


        <!-- الامتحانات -->

        <div class="card">

            <h3>📝 الامتحانات</h3>

            <div id="examsList">
                <p class="empty">جاري تحميل الامتحانات...</p>
            </div>

        </div>


        <!-- منطقة الامتحان -->

        <div
            class="card"
            id="examArea"
            style="display: none;"
        >

            <h3 id="examTitle">
                الامتحان
            </h3>

            <div id="questionsContainer"></div>

            <button
                class="submit-btn"
                onclick="submitExam()"
            >
                تسليم الامتحان ✅
            </button>

        </div>


        <!-- النتيجة -->

        <div
            class="card"
            id="resultArea"
            style="display: none;"
        >

            <h3>🎯 نتيجة الامتحان</h3>

            <div
                class="result"
                id="resultText"
            ></div>

        </div>


    </main>


    <footer>
        <p>© 2026 Nova Future</p>
    </footer>


    <script src="../js/app.js"></script>

</body>
</html>
