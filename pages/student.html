<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة الطالب - Nova Future</title>

    <link rel="stylesheet" href="../css/style.css">

    <script type="module">
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { auth, db } from "../js/firebase-config.js";


        // تسجيل الخروج
        window.logoutStudent = async function () {

            try {

                await signOut(auth);

                window.location.href = "login.html";

            } catch (error) {

                console.error(error);

                alert("حدث خطأ أثناء تسجيل الخروج ❌");
            }
        };


        // التحقق من صلاحية الطالب
        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href = "login.html";

                return;
            }

            try {

                const userDoc = await getDoc(
                    doc(db, "users", user.uid)
                );


                if (!userDoc.exists()) {

                    alert("بيانات المستخدم غير موجودة ❌");

                    window.location.href = "login.html";

                    return;
                }


                const userData = userDoc.data();


                if (userData.role !== "student") {

                    alert("ليس لديك صلاحية لدخول لوحة الطالب ❌");


                    if (userData.role === "admin") {

                        window.location.href = "admin.html";

                    } else if (userData.role === "teacher") {

                        window.location.href = "teacher.html";

                    } else {

                        window.location.href = "login.html";
                    }

                }

            } catch (error) {

                console.error(error);

                alert("حدث خطأ أثناء التحقق من الصلاحيات ❌");

                window.location.href = "login.html";
            }

        });

    </script>
</head>


<body>

    <header>

        <h1>Nova Future</h1>

        <p>لوحة الطالب</p>

    </header>


    <main>

        <section>

            <h2>مرحبًا بك 👋</h2>

            <p>
                من هنا تقدر تتابع دروسك وامتحاناتك.
            </p>

            <button onclick="logoutStudent()">
                تسجيل الخروج 🚪
            </button>

        </section>


        <section>

            <h2>الدورات 📚</h2>

            <p>
                هنا ستظهر الدورات المتاحة لك.
            </p>

        </section>


        <section>

            <h2>الامتحانات 📝</h2>

            <p>
                هنا ستظهر الامتحانات الخاصة بك.
            </p>

        </section>


        <section>

            <h2>النتائج 📊</h2>

            <p>
                هنا ستظهر درجاتك ونتائج الامتحانات.
            </p>

        </section>


        <section>

            <a href="../index.html">
                العودة للرئيسية
            </a>

        </section>

    </main>


    <script src="../js/app.js"></script>

</body>
</html>
