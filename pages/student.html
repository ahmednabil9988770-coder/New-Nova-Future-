<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Future - الطالب</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .topbar {
            background: #111827;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        .logout {
            background: #dc2626;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .welcome {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .welcome h1 {
            margin-top: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,.07);
        }

        .stat strong {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
            color: #2563eb;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.07);
        }

        .card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }

        .exam-card {
            border-right: 5px solid #2563eb;
        }

        .result-card {
            border-right: 5px solid #16a34a;
        }

        .hidden {
            display: none;
        }

        .question {
            margin: 20px 0;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            background: #eef2ff;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .topbar {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<div class="topbar">
    <div class="logo">🚀 Nova Future</div>
    <button class="logout" id="logoutBtn">تسجيل الخروج</button>
</div>

<div class="container">

    <div class="welcome">
        <h1>أهلاً بك يا <span id="studentName">...</span> 👋</h1>
        <p>مرحباً بك في منصة Nova Future التعليمية.</p>
    </div>

    <div class="stats">
        <div class="stat">
            <strong id="coursesCount">0</strong>
            الدورات
        </div>

        <div class="stat">
            <strong id="lessonsCount">0</strong>
            الدروس
        </div>

        <div class="stat">
            <strong id="examsCount">0</strong>
            الامتحانات
        </div>

        <div class="stat">
            <strong id="resultsCount">0</strong>
            النتائج
        </div>
    </div>

    <div class="section">
        <h2>📚 الدورات</h2>
        <div id="coursesList">جاري التحميل...</div>
    </div>

    <div class="section">
        <h2>📖 الدروس</h2>
        <div id="lessonsList">جاري التحميل...</div>
    </div>

    <div class="section">
        <h2>📝 الامتحانات</h2>
        <div id="examsList">جاري التحميل...</div>
    </div>

    <div class="section hidden" id="examSection">

        <h2 id="examTitle"></h2>

        <p id="examDescription"></p>

        <div id="questionsContainer"></div>

        <button id="submitExamBtn">
            تسليم الامتحان
        </button>

        <div id="examMessage" class="message hidden"></div>

    </div>

    <div class="section">
        <h2>🏆 النتائج</h2>

        <div id="resultsList">
            جاري التحميل...
        </div>
    </div>

</div>


<script type="module">

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    getDocs,
    addDoc,
    serverTimestamp,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    auth,
    db
} from "../js/firebase-config.js";


let currentUser = null;
let currentExam = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "login.html";

        return;
    }


    currentUser = user;


    try {

        const userRef =
            doc(db, "users", user.uid);


        const userSnap =
            await getDoc(userRef);


        if (!userSnap.exists()) {

            alert("لم يتم العثور على بيانات الطالب.");

            await signOut(auth);

            window.location.href = "login.html";

            return;
        }


        const userData =
            userSnap.data();


        if (userData.role !== "student") {

            alert("هذا الحساب ليس حساب طالب.");

            await signOut(auth);

            window.location.href = "login.html";

            return;
        }


        document.getElementById("studentName").textContent =
            userData.name || "الطالب";


        await loadCourses();

        await loadLessons();

        await loadExams();

        await loadResults();


    } catch (error) {

        console.error(error);


        alert(
            "حدث خطأ أثناء تحميل بيانات الطالب:\n\n" +
            error.code +
            "\n\n" +
            error.message
        );
    }
});


/* =========================
   LOGOUT
========================= */

document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

        await signOut(auth);

        window.location.href = "login.html";

    });


/* =========================
   COURSES
========================= */

async function loadCourses() {

    const container =
        document.getElementById("coursesList");


    const snapshot =
        await getDocs(
            collection(db, "courses")
        );


    container.innerHTML = "";


    let count = 0;


    snapshot.forEach((docSnap) => {

        const course =
            docSnap.data();


        count++;


        const div =
            document.createElement("div");


        div.className = "card";


        div.innerHTML = `

            <h3>
                ${escapeHTML(
                    course.title || "بدون عنوان"
                )}
            </h3>

            <p>
                ${escapeHTML(
                    course.description || ""
                )}
            </p>

        `;


        container.appendChild(div);

    });


    if (count === 0) {

        container.innerHTML =
            "<p>لا توجد دورات حالياً.</p>";

    }


    document.getElementById("coursesCount").textContent =
        count;
}


/* =========================
   LESSONS
========================= */

async function loadLessons() {

    const container =
        document.getElementById("lessonsList");


    const snapshot =
        await getDocs(
            collection(db, "lessons")
        );


    container.innerHTML = "";


    let count = 0;


    snapshot.forEach((docSnap) => {

        const lesson =
            docSnap.data();


        count++;


        const div =
            document.createElement("div");


        div.className = "card";


        div.innerHTML = `

            <h3>
                ${escapeHTML(
                    lesson.title || "درس بدون عنوان"
                )}
            </h3>

            <p>
                <strong>الدورة:</strong>
                ${escapeHTML(
                    lesson.courseName || ""
                )}
            </p>

            <p>
                ${escapeHTML(
                    lesson.content || ""
                )}
            </p>

        `;


        container.appendChild(div);

    });


    if (count === 0) {

        container.innerHTML =
            "<p>لا توجد دروس حالياً.</p>";

    }


    document.getElementById("lessonsCount").textContent =
        count;
}


/* =========================
   EXAMS
========================= */

async function loadExams() {

    const container =
        document.getElementById("examsList");


    const snapshot =
        await getDocs(
            collection(db, "exams")
        );


    container.innerHTML = "";


    let count = 0;


    snapshot.forEach((docSnap) => {

        const exam =
            docSnap.data();


        count++;


        const div =
            document.createElement("div");


        div.className =
            "card exam-card";


        div.innerHTML = `

            <h3>
                ${escapeHTML(
                    exam.title || "امتحان"
                )}
            </h3>

            <p>
                ${escapeHTML(
                    exam.description || ""
                )}
            </p>

            <p>
                عدد الأسئلة:
                ${(exam.questions || []).length}
            </p>

            <button>
                ابدأ الامتحان
            </button>

        `;


        div
            .querySelector("button")
            .addEventListener("click", () => {

                startExam({

                    id: docSnap.id,

                    ...exam

                });

            });


        container.appendChild(div);

    });


    if (count === 0) {

        container.innerHTML =
            "<p>لا توجد امتحانات حالياً.</p>";

    }


    document.getElementById("examsCount").textContent =
        count;
}


/* =========================
   START EXAM
========================= */

function startExam(exam) {

    currentExam = exam;


    document
        .getElementById("examSection")
        .classList.remove("hidden");


    document.getElementById("examTitle").textContent =
        exam.title || "الامتحان";


    document.getElementById("examDescription").textContent =
        exam.description || "";


    const container =
        document.getElementById("questionsContainer");


    container.innerHTML = "";


    const questions =
        exam.questions || [];


    questions.forEach((question, index) => {

        const div =
            document.createElement("div");


        div.className =
            "question";


        let optionsHTML = "";


        (question.options || [])
            .forEach((option, optionIndex) => {

                optionsHTML += `

                    <label class="option">

                        <input
                            type="radio"
                            name="question_${index}"
                            value="${optionIndex}"
                        >

                        ${escapeHTML(option)}

                    </label>

                `;

            });


        div.innerHTML = `

            <strong>
                ${index + 1}.
                ${escapeHTML(
                    question.question || ""
                )}
            </strong>

            ${optionsHTML}

        `;


        container.appendChild(div);

    });


    document
        .getElementById("examSection")
        .scrollIntoView({
            behavior: "smooth"
        });


    document
        .getElementById("examMessage")
        .classList.add("hidden");
}


/* =========================
   SUBMIT EXAM
========================= */

document
    .getElementById("submitExamBtn")
    .addEventListener("click", submitExam);


async function submitExam() {

    if (!currentExam) {

        alert("اختر امتحان أولاً.");

        return;
    }


    const questions =
        currentExam.questions || [];


    let score = 0;


    questions.forEach((question, index) => {

        const selected =
            document.querySelector(
                `input[name="question_${index}"]:checked`
            );


        if (
            selected &&
            Number(selected.value) ===
            Number(question.correctAnswer)
        ) {

            score++;

        }

    });


    const total =
        questions.length;


    const percentage =
        total > 0
            ? Math.round(
                (score / total) * 100
            )
            : 0;


    const resultData = {

        studentId:
            currentUser.uid,

        studentName:
            document.getElementById(
                "studentName"
            ).textContent,

        examId:
            currentExam.id,

        examTitle:
            currentExam.title,

        score:
            score,

        total:
            total,

        percentage:
            percentage,

        createdAt:
            serverTimestamp()

    };


    try {

        await addDoc(
            collection(db, "results"),
            resultData
        );


        const message =
            document.getElementById(
                "examMessage"
            );


        message.classList.remove("hidden");


        message.textContent =
            `تم تسليم الامتحان بنجاح 🎉 النتيجة: ${score}/${total} (${percentage}%)`;


        await loadResults();


    } catch (error) {

        console.error(
            "RESULT ERROR:",
            error
        );


        alert(
            "خطأ أثناء حفظ النتيجة:\n\n" +
            error.code +
            "\n\n" +
            error.message
        );

    }
}


/* =========================
   RESULTS
========================= */

async function loadResults() {

    const container =
        document.getElementById(
            "resultsList"
        );


    /*
       مهم:
       لا نطلب كل النتائج.
       نطلب نتائج الطالب الحالي فقط.
    */

    const resultsQuery =
        query(
            collection(db, "results"),
            where(
                "studentId",
                "==",
                currentUser.uid
            )
        );


    const snapshot =
        await getDocs(resultsQuery);


    container.innerHTML = "";


    let count = 0;


    snapshot.forEach((docSnap) => {

        const result =
            docSnap.data();


        count++;


        const div =
            document.createElement("div");


        div.className =
            "card result-card";


        div.innerHTML = `

            <h3>
                ${escapeHTML(
                    result.examTitle || "امتحان"
                )}
            </h3>

            <p>
                النتيجة:
                ${result.score || 0}/${result.total || 0}
            </p>

            <p>
                النسبة:
                ${result.percentage || 0}%
            </p>

        `;


        container.appendChild(div);

    });


    if (count === 0) {

        container.innerHTML =
            "<p>لا توجد نتائج حتى الآن.</p>";

    }


    document.getElementById(
        "resultsCount"
    ).textContent = count;
}


/* =========================
   SECURITY HELPER
========================= */

function escapeHTML(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;
}

</script>

</body>
</html>
