<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Future - الطالب</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --background-color: #f4f7fb;
            --surface-color: #ffffff;
            --text-color: #222;
            --border-color: #e5e7eb;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }

        .topbar {
            background: var(--primary-dark);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button,
        .profile-btn,
        .settings-btn {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            background: var(--primary-color);
            color: white;
            font-size: 15px;
            text-decoration: none;
            display: inline-block;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .profile-btn {
            background: #374151;
        }

        .settings-btn {
            background: var(--primary-color);
        }

        .logout {
            background: #dc2626;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .welcome {
            background: var(--surface-color);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .welcome h1 {
            margin-top: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: var(--surface-color);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,.07);
        }

        .stat strong {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .section {
            background: var(--surface-color);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.07);
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }

        .exam-card {
            border-right: 5px solid var(--primary-color);
        }

        .result-card {
            border-right: 5px solid #16a34a;
        }

        .hidden {
            display: none;
        }

        .question {
            margin: 20px 0;
            padding: 15px;
            background: var(--background-color);
            border-radius: 10px;
        }

        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            background: #eef2ff;
        }

        .timer-box {
            background: #fff7ed;
            border: 2px solid #f97316;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0 20px;
            text-align: center;
        }

        .timer-label {
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        #examTimer {
            font-size: 32px;
            font-weight: bold;
            color: #ea580c;
            direction: ltr;
        }

        .timer-warning {
            color: #dc2626 !important;
        }

        body.dark {
            --background-color: #111827;
            --surface-color: #1f2937;
            --text-color: #f9fafb;
            --border-color: #374151;
        }

        body.dark .question {
            background: #111827;
        }

        body.dark .message {
            background: #312e81;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .topbar {
                flex-wrap: wrap;
            }

            .topbar-actions {
                width: 100%;
                justify-content: flex-end;
                flex-wrap: wrap;
            }

        }

    </style>

</head>

<body>

    <div class="topbar">

        <div class="logo">
            🚀 Nova Future
        </div>

        <div class="topbar-actions">

            <a
                href="profile.html"
                class="profile-btn"
            >
                👤 الملف الشخصي
            </a>

            <a
                href="settings.html"
                class="settings-btn"
                id="settingsBtn"
            >
                ⚙️ الإعدادات
            </a>

            <button
                class="logout"
                id="logoutBtn"
            >
                تسجيل الخروج
            </button>

        </div>

    </div>


    <div class="container">

        <div class="welcome">

            <h1>
                أهلاً بك يا
                <span id="studentName">...</span>
                👋
            </h1>

            <p>
                مرحباً بك في منصة Nova Future التعليمية.
            </p>

        </div>


        <div class="stats">

            <div class="stat">
                <strong id="coursesCount">0</strong>
                الدورات
            </div>

            <div class="stat">
                <strong id="lessonsCount">0</strong>
                الدروس
            </div>

            <div class="stat">
                <strong id="examsCount">0</strong>
                الامتحانات
            </div>

            <div class="stat">
                <strong id="resultsCount">0</strong>
                النتائج
            </div>

        </div>


        <div class="section">

            <h2>📚 الدورات</h2>

            <div id="coursesList">
                جاري التحميل...
            </div>

        </div>


        <div class="section">

            <h2>📖 الدروس</h2>

            <div id="lessonsList">
                جاري التحميل...
            </div>

        </div>


        <div class="section">

            <h2>📝 الامتحانات</h2>

            <div id="examsList">
                جاري التحميل...
            </div>

        </div>


        <div
            class="section hidden"
            id="examSection"
        >

            <h2 id="examTitle"></h2>

            <p id="examDescription"></p>


            <div class="timer-box">

                <div class="timer-label">
                    ⏱️ الوقت المتبقي
                </div>

                <div id="examTimer">
                    00:00
                </div>

            </div>


            <div id="questionsContainer"></div>


            <button id="submitExamBtn">
                تسليم الامتحان
            </button>


            <div
                id="examMessage"
                class="message hidden"
            ></div>

        </div>


        <div class="section">

            <h2>🏆 النتائج</h2>

            <div id="resultsList">
                جاري التحميل...
            </div>

        </div>

    </div>


<script type="module">

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    getDocs,
    addDoc,
    serverTimestamp,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    auth,
    db
} from "../js/firebase-config.js";


let currentUser = null;
let currentExam = null;

let examTimerInterval = null;
let examTimeRemaining = 0;
let examSubmitted = false;


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "login.html";

        return;
    }


    currentUser = user;


    try {

        const userRef =
            doc(db, "users", user.uid);


        const userSnap =
            await getDoc(userRef);


        if (!userSnap.exists()) {

            alert("لم يتم العثور على بيانات الطالب.");

            await signOut(auth);

            window.location.href = "login.html";

            return;
        }


        const userData =
            userSnap.data();


        if (userData.role !== "student") {

            alert("هذا الحساب ليس حساب طالب.");

            await signOut(auth);

            window.location.href = "login.html";

            return;
        }


        document.getElementById("studentName").textContent =
            userData.name || "الطالب";


        await loadCourses();
        await loadLessons();
        await loadExams();
        await loadResults();


    } catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء تحميل بيانات الطالب:\n\n" +
            error.code +
            "\n\n" +
            error.message
        );

    }

});


/* =========================
   LOGOUT
========================= */

document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

        stopExamTimer();

        await signOut(auth);

        window.location.href = "login.html";

    });


/* =========================
   COURSES
========================= */

async function loadCourses() {

    const container =
        document.getElementById("coursesList");


    const snapshot =
        await getDocs(
            collection(db, "courses")
        );


    container.innerHTML = "";


    let count = 0;


    snapshot.forEach((docSnap) => {

        const course =
            docSnap.data();


        count++;


        const div =
            document.createElement("div");


        div.className = "card";


        div.innerHTML = `

            <h3>
                ${escapeHTML(
                    course.title || "بدون عنوان"
                )}
            </h3>

            <p>
                ${escapeHTML(
                    course.description || ""
                )}
            </p>

        `;


        container.appendChild(div);

    });


    if (count === 0) {

        container.innerHTML =
            "<p>لا توجد دورات حالياً.</p>";

    }


    document.getElementById("coursesCount").textContent =
        count;

}


/* =========================
   LESSONS
========================= */

async function loadLessons() {

    const container =
        document.getElementById("lessonsList");


    const snapshot =
        await getDocs(
            collection(db, "lessons")
        );


    container.innerHTML = "";


    let count = 0;


    snapshot.forEach((docSnap) => {

        const lesson =
            docSnap.data();


        count++;


        const div =
            document.createElement("div");


        div.className = "card";


        div.innerHTML = `

            <h3>
                ${escapeHTML(
                    lesson.title || "درس بدون عنوان"
                )}
            </h3>

            <p>
                <strong>الدورة:</strong>
                ${escapeHTML(
                    lesson.courseName || ""
                )}
            </p>

            <p>
                ${escapeHTML(
                    lesson.content || ""
                )}
            </p>

        `;


        container.appendChild(div);

    });


    if (count === 0) {

        container.innerHTML =
            "<p>لا توجد دروس حالياً.</p>";

    }


    document.getElementById("lessonsCount").textContent =
        count;

}


/* =========================
   EXAMS
========================= */

async function loadExams() {

    const container =
        document.getElementById("examsList");


    const snapshot =
        await getDocs(
            collection(db, "exams")
        );


    container.innerHTML = "";


    let count = 0;


    snapshot.forEach((docSnap) => {

        const exam =
            docSnap.data();


        count++;


        const div =
            document.createElement("div");


        div.className =
            "card exam-card";


        div.innerHTML = `

            <h3>
                ${escapeHTML(
                    exam.title || "امتحان"
                )}
            </h3>

            <p>
                ${escapeHTML(
                    exam.description || ""
                )}
            </p>

            <p>
                عدد الأسئلة:
                ${(exam.questions || []).length}
            </p>

            <p>
                مدة الامتحان:
                ${Number(exam.duration || 0)}
                دقيقة
            </p>

            <button>
                ابدأ الامتحان
            </button>

        `;


        div
            .querySelector("button")
            .addEventListener("click", () => {

                startExam({

                    id: docSnap.id,

                    ...exam

                });

            });


        container.appendChild(div);

    });


    if (count === 0) {

        container.innerHTML =
            "<p>لا توجد امتحانات حالياً.</p>";

    }


    document.getElementById("examsCount").textContent =
        count;

}


/* =========================
   START EXAM
========================= */

function startExam(exam) {

    stopExamTimer();

    currentExam = exam;

    examSubmitted = false;


    document
        .getElementById("examSection")
        .classList.remove("hidden");


    document.getElementById("examTitle").textContent =
        exam.title || "الامتحان";


    document.getElementById("examDescription").textContent =
        exam.description || "";


    const container =
        document.getElementById("questionsContainer");


    container.innerHTML = "";


    const questions =
        exam.questions || [];


    questions.forEach((question, index) => {

        const div =
            document.createElement("div");


        div.className =
            "question";


        let optionsHTML = "";


        (question.options || [])
            .forEach((option, optionIndex) => {

                optionsHTML += `

                    <label class="option">

                        <input
                            type="radio"
                            name="question_${index}"
                            value="${optionIndex}"
                        >

                        ${escapeHTML(option)}

                    </label>

                `;

            });


        div.innerHTML = `

            <strong>
                ${index + 1}.
                ${escapeHTML(
                    question.question || ""
                )}
            </strong>

            ${optionsHTML}

        `;


        container.appendChild(div);

    });


    const submitButton =
        document.getElementById("submitExamBtn");


    submitButton.disabled = false;

    submitButton.textContent =
        "تسليم الامتحان";


    document
        .getElementById("examMessage")
        .classList.add("hidden");


    const duration =
        Number(exam.duration || 0);


    if (duration > 0) {

        examTimeRemaining =
            duration * 60;

        updateTimerDisplay();


        examTimerInterval =
            setInterval(() => {

                examTimeRemaining--;

                updateTimerDisplay();


                if (examTimeRemaining <= 0) {

                    stopExamTimer();

                    autoSubmitExam();

                }

            }, 1000);

    } else {

        document.getElementById("examTimer").textContent =
            "بدون وقت محدد";

    }


    document
        .getElementById("examSection")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =========================
   TIMER DISPLAY
========================= */

function updateTimerDisplay() {

    const timer =
        document.getElementById("examTimer");


    const minutes =
        Math.floor(examTimeRemaining / 60);


    const seconds =
        examTimeRemaining % 60;


    timer.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");


    if (examTimeRemaining <= 60) {

        timer.classList.add("timer-warning");

    } else {

        timer.classList.remove("timer-warning");

    }

}


/* =========================
   STOP TIMER
========================= */

function stopExamTimer() {

    if (examTimerInterval !== null) {

        clearInterval(examTimerInterval);

        examTimerInterval = null;

    }

}


/* =========================
   AUTO SUBMIT
========================= */

async function autoSubmitExam() {

    if (examSubmitted) {

        return;

    }


    const message =
        document.getElementById("examMessage");


    message.classList.remove("hidden");


    message.textContent =
        "⏰ انتهى وقت الامتحان، جاري تسليم الإجابات تلقائيًا...";


    await submitExam(true);

}


/* =========================
   SUBMIT EXAM
========================= */

document
    .getElementById("submitExamBtn")
    .addEventListener("click", () => {

        submitExam(false);

    });


async function submitExam(isAutoSubmit = false) {

    if (!currentExam) {

        alert("اختر امتحان أولاً.");

        return;

    }


    if (examSubmitted) {

        return;

    }


    examSubmitted = true;

    stopExamTimer();


    const submitButton =
        document.getElementById("submitExamBtn");


    submitButton.disabled = true;


    const questions =
        currentExam.questions || [];


    let score = 0;


    questions.forEach((question, index) => {

        const selected =
            document.querySelector(
                `input[name="question_${index}"]:checked`
            );


        if (
            selected &&
            Number(selected.value) ===
            Number(question.correctAnswer)
        ) {

            score++;

        }

    });


    const total =
        questions.length;


    const percentage =
        total > 0
            ? Math.round(
                (score / total) * 100
            )
            : 0;


    const resultData = {

        studentId:
            currentUser.uid,

        studentName:
            document.getElementById(
                "studentName"
            ).textContent,

        examId:
            currentExam.id,

        examTitle:
            currentExam.title,

        score:
            score,

        total:
            total,

        percentage:
            percentage,

        createdAt:
            serverTimestamp()

    };


    try {

        await addDoc(
            collection(db, "results"),
            resultData
        );


        const message =
            document.getElementById(
                "examMessage"
            );


        message.classList.remove("hidden");


        if (isAutoSubmit) {

            message.textContent =
                `⏰ انتهى الوقت وتم تسليم الامتحان تلقائيًا. النتيجة: ${score}/${total} (${percentage}%)`;

        } else {

            message.textContent =
                `تم تسليم الامتحان بنجاح 🎉 النتيجة: ${score}/${total} (${percentage}%)`;

        }


        submitButton.textContent =
            "تم تسليم الامتحان ✅";


        await loadResults();


    } catch (error) {

        console.error(
            "RESULT ERROR:",
            error
        );


        examSubmitted = false;

        submitButton.disabled = false;


        alert(
            "خطأ أثناء حفظ النتيجة:\n\n" +
            error.code +
            "\n\n" +
            error.message
        );

    }

}


/* =========================
   RESULTS
========================= */

async function loadResults() {

    const container =
        document.getElementById(
            "resultsList"
        );


    const resultsQuery =
        query(
            collection(db, "results"),
            where(
                "studentId",
                "==",
                currentUser.uid
            )
        );


    const snapshot =
        await getDocs(resultsQuery);


    container.innerHTML = "";


    let count = 0;


    snapshot.forEach((docSnap) => {

        const result =
            docSnap.data();


        count++;


        const div =
            document.createElement("div");


        div.className =
            "card result-card";


        div.innerHTML = `

            <h3>
                ${escapeHTML(
                    result.examTitle || "امتحان"
                )}
            </h3>

            <p>
                النتيجة:
                ${result.score || 0}/${result.total || 0}
            </p>

            <p>
                النسبة:
                ${result.percentage || 0}%
            </p>

        `;


        container.appendChild(div);

    });


    if (count === 0) {

        container.innerHTML =
            "<p>لا توجد نتائج حتى الآن.</p>";

    }


    document.getElementById(
        "resultsCount"
    ).textContent = count;

}


/* =========================
   SECURITY HELPER
========================= */

function escapeHTML(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}

</script>


<!-- Global App -->
<script src="../js/app.js"></script>

</body>
</html>
