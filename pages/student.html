<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة الطالب - Nova Future</title>

    <link rel="stylesheet" href="../css/style.css">

    <script type="module">

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            doc,
            getDoc,
            collection,
            getDocs,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        import { auth, db } from "../js/firebase-config.js";


        // ================================
        // تسجيل الخروج
        // ================================

        window.logoutStudent = async function () {

            try {

                await signOut(auth);

                window.location.href = "login.html";

            } catch (error) {

                console.error(error);

                alert("حدث خطأ أثناء تسجيل الخروج ❌");
            }
        };


        // ================================
        // تحميل الدورات
        // ================================

        async function loadCourses() {

            const coursesList =
                document.getElementById("coursesList");

            coursesList.innerHTML =
                "جاري تحميل الدورات...";


            try {

                const coursesSnapshot =
                    await getDocs(
                        collection(db, "courses")
                    );


                coursesList.innerHTML = "";


                if (coursesSnapshot.empty) {

                    coursesList.innerHTML =
                        "<p>لا توجد دورات متاحة حاليًا.</p>";

                    return;
                }


                coursesSnapshot.forEach((courseDoc) => {

                    const courseData =
                        courseDoc.data();


                    const courseCard =
                        document.createElement("div");


                    courseCard.style.border =
                        "1px solid #ddd";

                    courseCard.style.padding =
                        "15px";

                    courseCard.style.marginBottom =
                        "10px";

                    courseCard.style.borderRadius =
                        "10px";


                    const title =
                        document.createElement("h3");

                    title.textContent =
                        courseData.name || "بدون اسم";


                    const description =
                        document.createElement("p");

                    description.textContent =
                        courseData.description || "بدون وصف";


                    courseCard.appendChild(title);

                    courseCard.appendChild(description);

                    coursesList.appendChild(courseCard);

                });


            } catch (error) {

                console.error(error);

                coursesList.innerHTML =
                    "<p>حدث خطأ أثناء تحميل الدورات ❌</p>";
            }

        }


        // ================================
        // تحميل الدروس
        // ================================

        async function loadLessons() {

            const lessonsList =
                document.getElementById("lessonsList");

            lessonsList.innerHTML =
                "جاري تحميل الدروس...";


            try {

                const lessonsSnapshot =
                    await getDocs(
                        collection(db, "lessons")
                    );


                lessonsList.innerHTML = "";


                if (lessonsSnapshot.empty) {

                    lessonsList.innerHTML =
                        "<p>لا توجد دروس متاحة حاليًا.</p>";

                    return;
                }


                lessonsSnapshot.forEach((lessonDoc) => {

                    const lessonData =
                        lessonDoc.data();


                    const lessonCard =
                        document.createElement("div");


                    lessonCard.style.border =
                        "1px solid #ddd";

                    lessonCard.style.padding =
                        "15px";

                    lessonCard.style.marginBottom =
                        "10px";

                    lessonCard.style.borderRadius =
                        "10px";


                    const title =
                        document.createElement("h3");

                    title.textContent =
                        lessonData.title || "بدون عنوان";


                    const course =
                        document.createElement("p");

                    course.textContent =
                        "الدورة: " +
                        (lessonData.courseName || "غير محددة");


                    const content =
                        document.createElement("p");

                    content.textContent =
                        lessonData.content || "بدون محتوى";


                    lessonCard.appendChild(title);

                    lessonCard.appendChild(course);

                    lessonCard.appendChild(content);

                    lessonsList.appendChild(lessonCard);

                });


            } catch (error) {

                console.error(error);

                lessonsList.innerHTML =
                    "<p>حدث خطأ أثناء تحميل الدروس ❌</p>";
            }

        }


        // ================================
        // تحميل الامتحانات
        // ================================

        async function loadExams() {

            const examsList =
                document.getElementById("examsList");

            examsList.innerHTML =
                "جاري تحميل الامتحانات...";


            try {

                const examsSnapshot =
                    await getDocs(
                        collection(db, "exams")
                    );


                examsList.innerHTML = "";


                if (examsSnapshot.empty) {

                    examsList.innerHTML =
                        "<p>لا توجد امتحانات متاحة حاليًا.</p>";

                    return;
                }


                examsSnapshot.forEach((examDoc) => {

                    const examData =
                        examDoc.data();


                    const examCard =
                        document.createElement("div");


                    examCard.style.border =
                        "1px solid #ddd";

                    examCard.style.padding =
                        "15px";

                    examCard.style.marginBottom =
                        "15px";

                    examCard.style.borderRadius =
                        "10px";


                    const title =
                        document.createElement("h3");

                    title.textContent =
                        examData.title || "بدون عنوان";


                    const description =
                        document.createElement("p");

                    description.textContent =
                        examData.description || "بدون وصف";


                    const questionsCount =
                        document.createElement("p");

                    questionsCount.textContent =
                        "عدد الأسئلة: " +
                        (examData.questions
                            ? examData.questions.length
                            : 0);


                    const startButton =
                        document.createElement("button");

                    startButton.textContent =
                        "بدء الامتحان 📝";


                    startButton.onclick =
                        function () {

                            startExam(
                                examDoc.id,
                                examData
                            );

                        };


                    examCard.appendChild(title);

                    examCard.appendChild(description);

                    examCard.appendChild(questionsCount);

                    examCard.appendChild(startButton);

                    examsList.appendChild(examCard);

                });


            } catch (error) {

                console.error(error);

                examsList.innerHTML =
                    "<p>حدث خطأ أثناء تحميل الامتحانات ❌</p>";
            }

        }


        // ================================
        // بدء الامتحان
        // ================================

        function startExam(examId, examData) {

            const questions =
                examData.questions || [];


            if (questions.length === 0) {

                alert("هذا الامتحان لا يحتوي على أسئلة حتى الآن ❌");

                return;
            }


            document.getElementById("examsList").style.display =
                "none";


            const examArea =
                document.getElementById("examArea");


            examArea.style.display =
                "block";


            document.getElementById("examTitle").textContent =
                examData.title || "الامتحان";


            const questionsContainer =
                document.getElementById("questionsContainer");


            questionsContainer.innerHTML = "";


            questions.forEach((question, index) => {

                const questionBox =
                    document.createElement("div");


                questionBox.style.border =
                    "1px solid #ddd";

                questionBox.style.padding =
                    "15px";

                questionBox.style.marginBottom =
                    "15px";

                questionBox.style.borderRadius =
                    "10px";


                const questionTitle =
                    document.createElement("h3");


                questionTitle.textContent =
                    (index + 1) +
                    ". " +
                    question.question;


                questionBox.appendChild(
                    questionTitle
                );


                question.options.forEach(
                    (option, optionIndex) => {

                        const label =
                            document.createElement("label");


                        label.style.display =
                            "block";

                        label.style.margin =
                            "10px 0";


                        const radio =
                            document.createElement("input");


                        radio.type =
                            "radio";

                        radio.name =
                            "question_" + index;

                        radio.value =
                            optionIndex;


                        label.appendChild(radio);

                        label.appendChild(
                            document.createTextNode(
                                " " + option
                            )
                        );


                        questionBox.appendChild(
                            label
                        );

                    }
                );


                questionsContainer.appendChild(
                    questionBox
                );

            });


            document.getElementById("submitExamButton").onclick =
                function () {

                    submitExam(
                        examId,
                        questions
                    );

                };

        }


        // ================================
        // تسليم الامتحان
        // ================================

        async function submitExam(examId, questions) {

            let score = 0;

            let answered = 0;


            questions.forEach((question, index) => {

                const selected =
                    document.querySelector(
                        'input[name="question_' +
                        index +
                        '"]:checked'
                    );


                if (selected) {

                    answered++;


                    if (
                        Number(selected.value) ===
                        Number(question.correctAnswer)
                    ) {

                        score++;
                    }

                }

            });


            if (answered < questions.length) {

                const confirmSubmit =
                    confirm(
                        "لم تجب على كل الأسئلة. هل تريد تسليم الامتحان؟"
                    );


                if (!confirmSubmit) {

                    return;
                }

            }


            const total =
                questions.length;


            const percentage =
                Math.round(
                    (score / total) * 100
                );


            try {

                await addDoc(
                    collection(db, "results"),
                    {
                        studentId: auth.currentUser.uid,
                        examId: examId,
                        score: score,
                        total: total,
                        percentage: percentage,
                        createdAt: serverTimestamp()
                    }
                );


                document.getElementById("examArea").style.display =
                    "none";


                const resultArea =
                    document.getElementById("resultArea");


                resultArea.style.display =
                    "block";


                document.getElementById("resultText").textContent =
                    "حصلت على " +
                    score +
                    " من " +
                    total +
                    " (" +
                    percentage +
                    "%)";


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء حفظ النتيجة ❌"
                );
            }

        }


        // ================================
        // التحقق من الطالب
        // ================================

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }


            try {

                const userDoc =
                    await getDoc(
                        doc(db, "users", user.uid)
                    );


                if (!userDoc.exists()) {

                    alert(
                        "بيانات المستخدم غير موجودة ❌"
                    );

                    window.location.href =
                        "login.html";

                    return;
                }


                const userData =
                    userDoc.data();


                if (userData.role !== "student") {

                    alert(
                        "ليس لديك صلاحية لدخول لوحة الطالب ❌"
                    );


                    if (userData.role === "admin") {

                        window.location.href =
                            "admin.html";

                    } else if (
                        userData.role === "teacher"
                    ) {

                        window.location.href =
                            "teacher.html";

                    } else {

                        window.location.href =
                            "login.html";
                    }


                    return;
                }


                await loadCourses();

                await loadLessons();

                await loadExams();


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء تحميل لوحة الطالب ❌"
                );
            }

        });

    </script>
</head>


<body>

    <header>

        <h1>Nova Future</h1>

        <p>لوحة الطالب</p>

    </header>


    <main>

        <!-- الترحيب -->

        <section>

            <h2>مرحبًا بك 👋</h2>

            <p>
                من هنا تقدر تتابع دروسك وامتحاناتك.
            </p>

            <button onclick="logoutStudent()">
                تسجيل الخروج 🚪
            </button>

        </section>


        <!-- الدورات -->

        <section>

            <h2>الدورات 📚</h2>

            <div id="coursesList">
                جاري تحميل الدورات...
            </div>

        </section>


        <!-- الدروس -->

        <section>

            <h2>الدروس 📖</h2>

            <div id="lessonsList">
                جاري تحميل الدروس...
            </div>

        </section>


        <!-- الامتحانات -->

        <section>

            <h2>الامتحانات 📝</h2>

            <div id="examsList">
                جاري تحميل الامتحانات...
            </div>

        </section>


        <!-- منطقة الامتحان -->

        <section
            id="examArea"
            style="display: none;"
        >

            <h2 id="examTitle">
                الامتحان
            </h2>


            <div id="questionsContainer"></div>


            <button id="submitExamButton">
                تسليم الامتحان ✅
            </button>

        </section>


        <!-- النتيجة -->

        <section
            id="resultArea"
            style="display: none;"
        >

            <h2>نتيجة الامتحان 🎉</h2>

            <p id="resultText"></p>

            <button
                onclick="location.reload()"
            >
                العودة للامتحانات
            </button>

        </section>


        <section>

            <a href="../index.html">
                العودة للرئيسية
            </a>

        </section>

    </main>


    <script src="../js/app.js"></script>

</body>
</html>
