<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لوحة الطالب - Nova Future</title>

    <link rel="stylesheet"
          href="../css/style.css">


    <style>

        .dashboard {
            max-width: 1150px;
            margin: 30px auto;
            padding: 20px;
        }

        .top-bar,
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .top-bar {
            padding: 20px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
            flex-wrap: wrap;
        }

        .card {
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 20px;
        }

        .logout-btn {
            background: #dc2626;
            color: #fff;

            border: none;
            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;
        }

        .courses-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 15px;
        }

        .course-card {
            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .course-card h4 {
            margin-bottom: 10px;
        }

        .course-card p {
            color: #666;
            line-height: 1.7;
        }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lesson-card {
            border: 1px solid #e5e7eb;

            border-radius: 12px;

            padding: 18px;
        }

        .lesson-card h4 {
            margin-bottom: 10px;
        }

        .lesson-card p {
            color: #555;
            line-height: 1.8;
        }

        .lesson-content {
            background: #f5f7fb;

            padding: 18px;

            border-radius: 10px;

            margin-top: 12px;

            white-space: pre-wrap;

            line-height: 1.9;
        }

        .exam-card {
            border: 1px solid #e5e7eb;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 12px;
        }

        .exam-card h4 {
            margin-bottom: 8px;
        }

        .primary-btn {
            border: none;

            background: #222;

            color: white;

            padding: 11px 18px;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

            margin-top: 10px;
        }

        .secondary-btn {
            border: none;

            background: #2563eb;

            color: white;

            padding: 11px 18px;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

            margin-top: 10px;
        }

        .back-btn {
            border: none;

            background: #6b7280;

            color: white;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;

            margin-bottom: 15px;
        }

        .question {
            border: 1px solid #e5e7eb;

            padding: 18px;

            border-radius: 12px;

            margin-bottom: 15px;
        }

        .question h4 {
            margin-bottom: 15px;
        }

        .answer {
            display: block;

            padding: 10px;

            margin: 7px 0;

            background: #f5f7fb;

            border-radius: 8px;

            cursor: pointer;
        }

        .answer input {
            margin-left: 8px;
        }

        .result-box {
            background: #f5f7fb;

            padding: 25px;

            border-radius: 12px;

            text-align: center;
        }

        .result-box strong {
            display: block;

            font-size: 32px;

            margin: 10px 0;
        }

        .empty {
            color: #777;

            text-align: center;

            padding: 20px;
        }

        .error {
            color: #dc2626;

            margin-top: 10px;
        }

        .success {
            color: #15803d;

            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

    </style>


    <script type="module">

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            collection,
            getDocs,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


        import {
            auth,
            db
        } from "../js/firebase-config.js";


        // =====================================
        // المتغيرات
        // =====================================

        let courses = [];

        let lessons = [];

        let exams = [];

        let currentExam = null;

        let currentCourseId = null;


        // =====================================
        // تسجيل الخروج
        // =====================================

        window.logoutStudent = async function () {

            try {

                await signOut(auth);

                window.location.href =
                    "login.html";

            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء تسجيل الخروج ❌"
                );
            }
        };


        // =====================================
        // تحميل الكورسات
        // =====================================

        async function loadCourses() {

            const coursesList =
                document.getElementById(
                    "coursesList"
                );

            coursesList.innerHTML = "";


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "courses"
                        )
                    );


                courses = [];


                snapshot.forEach((courseDoc) => {

                    courses.push({

                        id: courseDoc.id,

                        ...courseDoc.data()

                    });

                });


                if (courses.length === 0) {

                    coursesList.innerHTML =
                        '<p class="empty">لا توجد كورسات حاليًا.</p>';

                    return;
                }


                courses.forEach((course) => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "course-card";


                    card.innerHTML = `

                        <h4>
                            📚 ${course.name || "بدون اسم"}
                        </h4>

                        <p>
                            ${course.description || "لا يوجد وصف للكورس."}
                        </p>

                    `;


                    card.onclick = () => {

                        openCourse(course.id);

                    };


                    coursesList.appendChild(card);

                });


            } catch (error) {

                console.error(error);

                coursesList.innerHTML =
                    '<p class="error">حدث خطأ أثناء تحميل الكورسات.</p>';
            }
        }


        // =====================================
        // تحميل الدروس
        // =====================================

        async function loadLessons() {

            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "lessons"
                        )
                    );


                lessons = [];


                snapshot.forEach((lessonDoc) => {

                    lessons.push({

                        id: lessonDoc.id,

                        ...lessonDoc.data()

                    });

                });


            } catch (error) {

                console.error(error);

                lessons = [];
            }
        }


        // =====================================
        // فتح الكورس
        // =====================================

        window.openCourse = function (
            courseId
        ) {

            currentCourseId =
                courseId;


            const course =
                courses.find(
                    (item) =>
                        item.id === courseId
                );


            if (!course) {
                return;
            }


            document.getElementById(
                "coursesSection"
            ).classList.add("hidden");


            document.getElementById(
                "courseDetailsSection"
            ).classList.remove("hidden");


            document.getElementById(
                "selectedCourseName"
            ).textContent =
                course.name || "الكورس";


            const selectedLessons =
                lessons.filter(
                    (lesson) =>
                        lesson.courseId === courseId
                );


            const lessonsList =
                document.getElementById(
                    "courseLessonsList"
                );


            lessonsList.innerHTML = "";


            if (selectedLessons.length === 0) {

                lessonsList.innerHTML =
                    '<p class="empty">لا توجد دروس في هذا الكورس حتى الآن.</p>';

                return;
            }


            selectedLessons.forEach(
                (lesson, index) => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "lesson-card";


                    card.innerHTML = `

                        <h4>
                            📖 ${index + 1}.
                            ${lesson.title || "درس بدون عنوان"}
                        </h4>

                        <div class="lesson-content">
                            ${lesson.content || "لا يوجد محتوى."}
                        </div>

                    `;


                    lessonsList.appendChild(card);

                }
            );
        };


        // =====================================
        // الرجوع للكورسات
        // =====================================

        window.backToCourses = function () {

            document.getElementById(
                "courseDetailsSection"
            ).classList.add("hidden");


            document.getElementById(
                "coursesSection"
            ).classList.remove("hidden");


            currentCourseId = null;
        };


        // =====================================
        // تحميل الامتحانات
        // =====================================

        async function loadExams() {

            const examsList =
                document.getElementById(
                    "examsList"
                );

            examsList.innerHTML = "";


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "exams"
                        )
                    );


                exams = [];


                snapshot.forEach((examDoc) => {

                    exams.push({

                        id: examDoc.id,

                        ...examDoc.data()

                    });

                });


                if (exams.length === 0) {

                    examsList.innerHTML =
                        '<p class="empty">لا توجد امتحانات حاليًا.</p>';

                    return;
                }


                exams.forEach((exam) => {

                    const questions =
                        Array.isArray(
                            exam.questions
                        )
                            ? exam.questions
                            : [];


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "exam-card";


                    card.innerHTML = `

                        <h4>
                            📝 ${exam.title || "امتحان بدون عنوان"}
                        </h4>

                        <p>
                            ${exam.description || ""}
                        </p>

                        <p>
                            عدد الأسئلة:
                            ${questions.length}
                        </p>

                        <button
                            class="primary-btn"
                            onclick="startExam('${exam.id}')"
                        >
                            بدء الامتحان 🚀
                        </button>

                    `;


                    examsList.appendChild(card);

                });


            } catch (error) {

                console.error(error);

                examsList.innerHTML =
                    '<p class="error">حدث خطأ أثناء تحميل الامتحانات.</p>';
            }
        }


        // =====================================
        // بدء الامتحان
        // =====================================

        window.startExam = function (
            examId
        ) {

            const exam =
                exams.find(
                    (item) =>
                        item.id === examId
                );


            if (!exam) {
                return;
            }


            currentExam = exam;


            const questions =
                Array.isArray(
                    exam.questions
                )
                    ? exam.questions
                    : [];


            if (questions.length === 0) {

                alert(
                    "هذا الامتحان لا يحتوي على أسئلة."
                );

                return;
            }


            document.getElementById(
                "coursesSection"
            ).classList.add("hidden");


            document.getElementById(
                "courseDetailsSection"
            ).classList.add("hidden");


            document.getElementById(
                "examsSection"
            ).classList.add("hidden");


            document.getElementById(
                "examSection"
            ).classList.remove("hidden");


            document.getElementById(
                "examTitle"
            ).textContent =
                exam.title || "الامتحان";


            const questionsContainer =
                document.getElementById(
                    "questionsContainer"
                );


            questionsContainer.innerHTML = "";


            questions.forEach(
                (question, index) => {

                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "question";


                    let optionsHTML = "";


                    question.options.forEach(
                        (option, optionIndex) => {

                            optionsHTML += `

                                <label class="answer">

                                    <input
                                        type="radio"
                                        name="question_${index}"
                                        value="${optionIndex}"
                                    >

                                    ${option}

                                </label>

                            `;
                        }
                    );


                    box.innerHTML = `

                        <h4>
                            ${index + 1}.
                            ${question.question}
                        </h4>

                        ${optionsHTML}

                    `;


                    questionsContainer.appendChild(
                        box
                    );

                }
            );

        };


        // =====================================
        // تسليم الامتحان
        // =====================================

        window.submitExam = async function () {

            if (!currentExam) {
                return;
            }


            const questions =
                Array.isArray(
                    currentExam.questions
                )
                    ? currentExam.questions
                    : [];


            let score = 0;


            for (
                let i = 0;
                i < questions.length;
                i++
            ) {

                const selected =
                    document.querySelector(
                        `input[name="question_${i}"]:checked`
                    );


                if (!selected) {

                    alert(
                        "من فضلك أجب عن جميع الأسئلة أولاً."
                    );

                    return;
                }


                if (
                    Number(selected.value) ===
                    Number(
                        questions[i].correctAnswer
                    )
                ) {

                    score++;

                }

            }


            const total =
                questions.length;


            const percentage =
                Math.round(
                    (score / total) * 100
                );


            try {

                await addDoc(
                    collection(
                        db,
                        "results"
                    ),
                    {

                        studentId:
                            auth.currentUser.uid,

                        examId:
                            currentExam.id,

                        score:
                            score,

                        total:
                            total,

                        percentage:
                            percentage,

                        createdAt:
                            serverTimestamp()

                    }
                );


                document.getElementById(
                    "examSection"
                ).classList.add("hidden");


                document.getElementById(
                    "resultSection"
                ).classList.remove("hidden");


                document.getElementById(
                    "resultScore"
                ).textContent =
                    `${score} / ${total}`;


                document.getElementById(
                    "resultPercentage"
                ).textContent =
                    `${percentage}%`;


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء حفظ النتيجة ❌"
                );
            }
        };


        // =====================================
        // العودة للامتحانات
        // =====================================

        window.backToExams = function () {

            currentExam = null;


            document.getElementById(
                "examSection"
            ).classList.add("hidden");


            document.getElementById(
                "resultSection"
            ).classList.add("hidden");


            document.getElementById(
                "examsSection"
            ).classList.remove("hidden");


            loadExams();
        };


        // =====================================
        // التحقق من الحساب
        // =====================================

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;
                }


                try {

                    const userSnapshot =
                        await getDoc(
                            doc(
                                db,
                                "users",
                                user.uid
                            )
                        );


                    if (
                        !userSnapshot.exists()
                    ) {

                        await signOut(auth);

                        window.location.href =
                            "login.html";

                        return;
                    }


                    const userData =
                        userSnapshot.data();


                    if (
                        userData.role !==
                        "student"
                    ) {

                        if (
                            userData.role ===
                            "admin"
                        ) {

                            window.location.href =
                                "admin.html";

                        } else if (
                            userData.role ===
                            "teacher"
                        ) {

                            window.location.href =
                                "teacher.html";

                        } else {

                            await signOut(auth);

                            window.location.href =
                                "login.html";
                        }

                        return;
                    }


                    document.getElementById(
                        "studentName"
                    ).textContent =
                        userData.name ||
                        "الطالب";


                    await loadCourses();

                    await loadLessons();

                    await loadExams();

                } catch (error) {

                    console.error(error);

                    alert(
                        "حدث خطأ أثناء تحميل لوحة الطالب."
                    );
                }

            }
        );

    </script>

</head>


<body>


    <header>

        <h1>
            Nova Future 🚀
        </h1>

        <p>
            لوحة الطالب
        </p>

    </header>


    <main class="dashboard">


        <!-- الترحيب -->

        <div class="top-bar">

            <div>

                <h2>

                    أهلاً بك يا

                    <span id="studentName">
                        ...
                    </span>

                    👨‍🎓

                </h2>

                <p>
                    تعلم، حل الامتحانات، وتابع نتائجك.
                </p>

            </div>


            <button
                class="logout-btn"
                onclick="logoutStudent()"
            >

                تسجيل الخروج

            </button>

        </div>


        <!-- الكورسات -->

        <section
            class="card"
            id="coursesSection"
        >

            <h3>
                📚 الكورسات
            </h3>


            <div
                class="courses-grid"
                id="coursesList"
            >

                <p class="empty">
                    جاري تحميل الكورسات...
                </p>

            </div>

        </section>


        <!-- تفاصيل الكورس -->

        <section
            class="card hidden"
            id="courseDetailsSection"
        >

            <button
                class="back-btn"
                onclick="backToCourses()"
            >
                ← العودة للكورسات
            </button>


            <h3>

                📚
                <span id="selectedCourseName">
                    الكورس
                </span>

            </h3>


            <div
                class="lessons-list"
                id="courseLessonsList"
            >

                <p class="empty">
                    جاري تحميل الدروس...
                </p>

            </div>

        </section>


        <!-- الامتحانات -->

        <section
            class="card"
            id="examsSection"
        >

            <h3>
                📝 الامتحانات
            </h3>


            <div id="examsList">

                <p class="empty">
                    جاري تحميل الامتحانات...
                </p>

            </div>

        </section>


        <!-- الامتحان -->

        <section
            class="card hidden"
            id="examSection"
        >

            <h3 id="examTitle">
                الامتحان
            </h3>


            <div
                id="questionsContainer"
            ></div>


            <button
                class="primary-btn"
                onclick="submitExam()"
            >

                تسليم الامتحان ✅

            </button>

        </section>


        <!-- النتيجة -->

        <section
            class="card hidden"
            id="resultSection"
        >

            <h3>
                🎉 نتيجة الامتحان
            </h3>


            <div class="result-box">

                <p>
                    درجتك:
                </p>


                <strong id="resultScore">
                    0 / 0
                </strong>


                <p>
                    النسبة:
                </p>


                <strong id="resultPercentage">
                    0%
                </strong>


                <button
                    class="secondary-btn"
                    onclick="backToExams()"
                >

                    العودة للامتحانات

                </button>

            </div>

        </section>


    </main>


    <footer>

        <p>
            © 2026 Nova Future
        </p>

    </footer>


    <script src="../js/app.js"></script>

</body>

</html>
