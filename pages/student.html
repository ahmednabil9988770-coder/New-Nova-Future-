<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حساب الطالب | Nova Future</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            background: #ffffff;
            padding: 16px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #2563eb;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 30px 20px 50px;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .welcome p {
            opacity: 0.9;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .stat-card h3 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #6b7280;
            font-size: 14px;
        }

        /* =========================
           SECTIONS
        ========================= */

        .section {
            margin-bottom: 35px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title h2 {
            font-size: 23px;
        }

        /* =========================
           COURSES
        ========================= */

        .courses {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .course-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .course-card:hover {
            transform: translateY(-3px);
        }

        .course-icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .course-card h3 {
            margin-bottom: 8px;
        }

        .course-card p {
            color: #6b7280;
            font-size: 14px;
            min-height: 40px;
            margin-bottom: 15px;
        }

        .course-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px;
            border-radius: 10px;
            font-size: 15px;
        }

        /* =========================
           LESSONS
        ========================= */

        .lesson-box {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.05);
        }

        .selected-course {
            color: #2563eb;
            margin-bottom: 20px;
        }

        .lesson-card {
            border: 1px solid #e5e7eb;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .lesson-card h3 {
            margin-bottom: 8px;
        }

        .lesson-card p {
            color: #6b7280;
            line-height: 1.7;
        }

        /* =========================
           EXAMS
        ========================= */

        .exams {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .exam-card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.05);
        }

        .exam-card h3 {
            margin-bottom: 8px;
        }

        .exam-card p {
            color: #6b7280;
            margin-bottom: 15px;
        }

        .exam-btn {
            border: none;
            background: #16a34a;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }

        /* =========================
           EXAM AREA
        ========================= */

        #examSection {
            display: none;
        }

        .question {
            background: white;
            padding: 22px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .question h3 {
            margin-bottom: 15px;
        }

        .option {
            display: block;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .option:hover {
            background: #eef2ff;
        }

        .submit-exam {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
        }

        /* =========================
           RESULT
        ========================= */

        #resultSection {
            display: none;
        }

        .result-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .result-score {
            font-size: 45px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #6b7280;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .courses {
                grid-template-columns: 1fr;
            }

            .exams {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 23px;
            }

            .topbar {
                padding: 14px 15px;
            }

            .container {
                padding: 20px 15px 40px;
            }
        }

        @media (max-width: 450px) {

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 16px 8px;
            }

            .stat-card h3 {
                font-size: 23px;
            }

            .logo {
                font-size: 20px;
            }

            .logout-btn {
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="logo">
            Nova <span>Future</span>
        </div>

        <button id="logoutBtn" class="logout-btn">
            تسجيل الخروج
        </button>

    </header>


    <main class="container">

        <!-- =========================
             WELCOME
        ========================== -->

        <section class="welcome">

            <h1>
                أهلاً بك يا <span id="studentName">الطالب</span> 👋
            </h1>

            <p>
                جاهز تكمل رحلتك التعليمية النهارده؟ 🚀
            </p>

        </section>


        <!-- =========================
             STATS
        ========================== -->

        <section class="stats">

            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <h3 id="coursesCount">0</h3>
                <p>الكورسات</p>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📖</div>
                <h3 id="lessonsCount">0</h3>
                <p>الدروس</p>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <h3 id="examsCount">0</h3>
                <p>الامتحانات</p>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <h3 id="resultsCount">0</h3>
                <p>النتائج</p>
            </div>

        </section>


        <!-- =========================
             COURSES
        ========================== -->

        <section class="section">

            <div class="section-title">
                <h2>📚 الكورسات</h2>
            </div>

            <div id="coursesContainer" class="courses">
                <div class="empty">
                    جاري تحميل الكورسات...
                </div>
            </div>

        </section>


        <!-- =========================
             LESSONS
        ========================== -->

        <section
            id="courseDetailsSection"
            class="section"
            style="display:none;"
        >

            <div class="lesson-box">

                <h2 class="selected-course">
                    📖 <span id="selectedCourseName"></span>
                </h2>

                <div id="lessonsContainer">
                </div>

            </div>

        </section>


        <!-- =========================
             EXAMS
        ========================== -->

        <section class="section">

            <div class="section-title">
                <h2>📝 الامتحانات</h2>
            </div>

            <div id="examsContainer" class="exams">
                <div class="empty">
                    جاري تحميل الامتحانات...
                </div>
            </div>

        </section>


        <!-- =========================
             EXAM
        ========================== -->

        <section id="examSection" class="section">

            <div class="lesson-box">

                <h2 id="examTitle"></h2>

                <div id="questionsContainer"></div>

                <button id="submitExamBtn" class="submit-exam">
                    إنهاء الامتحان
                </button>

            </div>

        </section>


        <!-- =========================
             RESULT
        ========================== -->

        <section id="resultSection" class="section">

            <div class="result-card">

                <h2>🎉 نتيجة الامتحان</h2>

                <div id="resultScore" class="result-score">
                    0%
                </div>

                <p id="resultDetails">
                    النتيجة
                </p>

            </div>

        </section>

    </main>


    <script type="module">

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            doc,
            getDoc,
            collection,
            getDocs,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        import {
            auth,
            db
        } from "../js/firebase-config.js";


        let currentUser = null;
        let currentExam = null;


        /* =========================
           AUTH
        ========================== */

        onAuthStateChanged(auth, async (user) => {

            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {

                const userDoc = await getDoc(
                    doc(db, "users", user.uid)
                );

                if (!userDoc.exists()) {
                    alert("بيانات الحساب غير موجودة.");
                    await signOut(auth);
                    return;
                }

                const userData = userDoc.data();

                if (userData.role === "admin") {
                    window.location.href = "admin.html";
                    return;
                }

                if (userData.role === "teacher") {
                    window.location.href = "teacher.html";
                    return;
                }

                if (userData.role !== "student") {
                    alert("لا يمكن فتح حساب الطالب.");
                    await signOut(auth);
                    return;
                }

                currentUser = user;

                document.getElementById("studentName").textContent =
                    userData.name || "الطالب";

                await loadCourses();
                await loadLessons();
                await loadExams();
                await loadResults();

            } catch (error) {

    console.error("Student Page Error:", error);

    alert(
        "خطأ Firebase:\n\n" +
        error.code +
        "\n\n" +
        error.message
    );

}

        });


        /* =========================
           LOGOUT
        ========================== */

        document
            .getElementById("logoutBtn")
            .addEventListener("click", async () => {

                await signOut(auth);

                window.location.href = "login.html";

            });


        /* =========================
           COURSES
        ========================== */

        async function loadCourses() {

            const container =
                document.getElementById("coursesContainer");

            container.innerHTML = "";

            const snapshot =
                await getDocs(
                    collection(db, "courses")
                );

            document.getElementById("coursesCount").textContent =
                snapshot.size;

            if (snapshot.empty) {

                container.innerHTML = `
                    <div class="empty">
                        لا توجد كورسات حالياً.
                    </div>
                `;

                return;
            }

            snapshot.forEach((courseDoc) => {

                const course = courseDoc.data();

                const card =
                    document.createElement("div");

                card.className = "course-card";

                card.innerHTML = `

                    <div class="course-icon">
                        📚
                    </div>

                    <h3>
                        ${course.name || "كورس بدون اسم"}
                    </h3>

                    <p>
                        ${course.description || "لا يوجد وصف للكورس."}
                    </p>

                    <button class="course-btn">
                        مشاهدة الدروس
                    </button>

                `;

                card
                    .querySelector("button")
                    .addEventListener(
                        "click",
                        () => showCourseLessons(
                            courseDoc.id,
                            course.name
                        )
                    );

                container.appendChild(card);

            });

        }


        /* =========================
           LESSONS
        ========================== */

        async function loadLessons() {

            const snapshot =
                await getDocs(
                    collection(db, "lessons")
                );

            document.getElementById("lessonsCount").textContent =
                snapshot.size;

        }


        async function showCourseLessons(
            courseId,
            courseName
        ) {

            const section =
                document.getElementById(
                    "courseDetailsSection"
                );

            const container =
                document.getElementById(
                    "lessonsContainer"
                );

            document.getElementById(
                "selectedCourseName"
            ).textContent = courseName;

            container.innerHTML = `
                <div class="empty">
                    جاري تحميل الدروس...
                </div>
            `;

            section.style.display = "block";

            section.scrollIntoView({
                behavior: "smooth"
            });

            const snapshot =
                await getDocs(
                    collection(db, "lessons")
                );

            container.innerHTML = "";

            let found = false;

            snapshot.forEach((lessonDoc) => {

                const lesson = lessonDoc.data();

                if (lesson.courseId !== courseId) {
                    return;
                }

                found = true;

                const card =
                    document.createElement("div");

                card.className = "lesson-card";

                card.innerHTML = `

                    <h3>
                        📖 ${lesson.title || "درس بدون عنوان"}
                    </h3>

                    <p>
                        ${lesson.content || "لا يوجد محتوى لهذا الدرس."}
                    </p>

                `;

                container.appendChild(card);

            });

            if (!found) {

                container.innerHTML = `
                    <div class="empty">
                        لا توجد دروس في هذا الكورس حتى الآن.
                    </div>
                `;

            }

        }


        /* =========================
           EXAMS
        ========================== */

        async function loadExams() {

            const container =
                document.getElementById(
                    "examsContainer"
                );

            container.innerHTML = "";

            const snapshot =
                await getDocs(
                    collection(db, "exams")
                );

            document.getElementById("examsCount").textContent =
                snapshot.size;

            if (snapshot.empty) {

                container.innerHTML = `
                    <div class="empty">
                        لا توجد امتحانات حالياً.
                    </div>
                `;

                return;
            }

            snapshot.forEach((examDoc) => {

                const exam = examDoc.data();

                const card =
                    document.createElement("div");

                card.className = "exam-card";

                const questionCount =
                    Array.isArray(exam.questions)
                        ? exam.questions.length
                        : 0;

                card.innerHTML = `

                    <h3>
                        📝 ${exam.title || "امتحان"}
                    </h3>

                    <p>
                        ${exam.description || "لا يوجد وصف للامتحان."}
                    </p>

                    <p>
                        عدد الأسئلة: ${questionCount}
                    </p>

                    <button class="exam-btn">
                        بدء الامتحان
                    </button>

                `;

                card
                    .querySelector("button")
                    .addEventListener(
                        "click",
                        () => startExam(
                            examDoc.id,
                            exam
                        )
                    );

                container.appendChild(card);

            });

        }


        /* =========================
           START EXAM
        ========================== */

        function startExam(
            examId,
            exam
        ) {

            if (
                !exam.questions ||
                exam.questions.length === 0
            ) {

                alert(
                    "هذا الامتحان لا يحتوي على أسئلة."
                );

                return;
            }

            currentExam = {
                id: examId,
                ...exam
            };

            document.getElementById(
                "examTitle"
            ).textContent =
                exam.title || "الامتحان";

            const container =
                document.getElementById(
                    "questionsContainer"
                );

            container.innerHTML = "";

            exam.questions.forEach(
                (question, index) => {

                    const div =
                        document.createElement("div");

                    div.className = "question";

                    let optionsHTML = "";

                    question.options.forEach(
                        (option, optionIndex) => {

                            optionsHTML += `

                                <label class="option">

                                    <input
                                        type="radio"
                                        name="question-${index}"
                                        value="${optionIndex}"
                                    >

                                    ${option}

                                </label>

                            `;

                        }
                    );

                    div.innerHTML = `

                        <h3>
                            ${index + 1}. ${question.question}
                        </h3>

                        ${optionsHTML}

                    `;

                    container.appendChild(div);

                }
            );

            document.getElementById(
                "examSection"
            ).style.display = "block";

            document.getElementById(
                "resultSection"
            ).style.display = "none";

            document.getElementById(
                "examSection"
            ).scrollIntoView({
                behavior: "smooth"
            });

        }


        /* =========================
           SUBMIT EXAM
        ========================== */

        document
            .getElementById("submitExamBtn")
            .addEventListener(
                "click",
                submitExam
            );


        async function submitExam() {

            if (!currentExam) {
                return;
            }

            let score = 0;

            const questions =
                currentExam.questions;

            for (
                let i = 0;
                i < questions.length;
                i++
            ) {

                const selected =
                    document.querySelector(
                        `input[name="question-${i}"]:checked`
                    );

                if (!selected) {

                    alert(
                        "من فضلك أجب عن جميع الأسئلة أولاً."
                    );

                    return;
                }

                const answer =
                    Number(selected.value);

                if (
                    answer ===
                    Number(
                        questions[i].correctAnswer
                    )
                ) {

                    score++;

                }

            }

            const total =
                questions.length;

            const percentage =
                Math.round(
                    (score / total) * 100
                );


            await addDoc(
                collection(db, "results"),
                {
                    studentId: currentUser.uid,
                    studentName:
                        document.getElementById(
                            "studentName"
                        ).textContent,
                    examId: currentExam.id,
                    examTitle:
                        currentExam.title,
                    score: score,
                    total: total,
                    percentage: percentage,
                    createdAt: serverTimestamp()
                }
            );


            document.getElementById(
                "resultScore"
            ).textContent =
                percentage + "%";


            document.getElementById(
                "resultDetails"
            ).textContent =
                `حصلت على ${score} من ${total}`;


            document.getElementById(
                "examSection"
            ).style.display = "none";


            document.getElementById(
                "resultSection"
            ).style.display = "block";


            document.getElementById(
                "resultSection"
            ).scrollIntoView({
                behavior: "smooth"
            });


            await loadResults();

        }


        /* =========================
           RESULTS
        ========================== */

        async function loadResults() {

            const snapshot =
                await getDocs(
                    collection(db, "results")
                );

            let count = 0;

            snapshot.forEach((resultDoc) => {

                const result =
                    resultDoc.data();

                if (
                    result.studentId ===
                    currentUser.uid
                ) {
                    count++;
                }

            });

            document.getElementById(
                "resultsCount"
            ).textContent = count;

        }

    </script>

</body>
</html>
