<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب - Nova Future</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            background: #f4f7fb;
        }

        .register-box {
            max-width: 500px;
            margin: 50px auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .links {
            margin-top: 20px;
            line-height: 2;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
        }

        .success {
            color: #16a34a;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🚀 Nova Future</h1>
        <p>إنشاء حساب جديد</p>
    </header>

    <main>

        <section class="register-box">

            <h2>إنشاء حساب 🎓</h2>

            <p>
                أنشئ حسابك وابدأ رحلتك التعليمية.
            </p>

            <form id="registerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="الاسم بالكامل"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="البريد الإلكتروني"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="كلمة المرور"
                    minlength="6"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="تأكيد كلمة المرور"
                    minlength="6"
                    required
                >

                <button
                    type="submit"
                    id="registerBtn"
                >
                    إنشاء الحساب
                </button>

            </form>

            <div id="message"></div>

            <div class="links">

                <p>
                    لديك حساب بالفعل؟
                    <a href="login.html">
                        تسجيل الدخول
                    </a>
                </p>

                <a href="../index.html">
                    🏠 العودة للرئيسية
                </a>

            </div>

        </section>

    </main>

    <script type="module">

        import {
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        import {
            auth,
            db
        } from "../js/firebase-config.js";


        const form =
            document.getElementById("registerForm");

        const button =
            document.getElementById("registerBtn");

        const message =
            document.getElementById("message");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            message.className = "";
            message.textContent = "";


            if (name.length < 2) {

                message.className = "error";
                message.textContent =
                    "من فضلك اكتب اسمًا صحيحًا.";

                return;
            }


            if (password !== confirmPassword) {

                message.className = "error";
                message.textContent =
                    "كلمتا المرور غير متطابقتين ❌";

                return;
            }


            if (password.length < 6) {

                message.className = "error";
                message.textContent =
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

                return;
            }


            button.disabled = true;
            button.textContent = "جاري إنشاء الحساب...";


            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                await setDoc(
                    doc(db, "users", user.uid),
                    {
                        name: name,
                        email: email,
                        role: "student",
                        createdAt: serverTimestamp()
                    }
                );


                message.className = "success";
                message.textContent =
                    "تم إنشاء الحساب بنجاح ✅";


                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1000);


            } catch (error) {

                console.error(error);

                message.className = "error";


                if (error.code === "auth/email-already-in-use") {

                    message.textContent =
                        "هذا البريد الإلكتروني مستخدم بالفعل.";

                }
                else if (error.code === "auth/invalid-email") {

                    message.textContent =
                        "البريد الإلكتروني غير صحيح.";

                }
                else if (error.code === "auth/weak-password") {

                    message.textContent =
                        "كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.";

                }
                else {

                    message.textContent =
                        "حدث خطأ أثناء إنشاء الحساب. حاول مرة أخرى.";

                }


                button.disabled = false;
                button.textContent = "إنشاء الحساب";

            }

        });

    </script>

    <script src="../js/app.js"></script>

</body>

</html>
