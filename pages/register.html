<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Nova Future</title><link rel="stylesheet" href="../css/style.css">
<script type="module">
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { auth } from "../js/firebase-config.js";

    window.createAccount = async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const confirmPassword = document.getElementById("confirmPassword").value;

if (password !== confirmPassword) {
    alert("كلمتا المرور غير متطابقتين ❌");
    return;
}
        try {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("تم إنشاء الحساب بنجاح ✅");
            window.location.href = "login.html";
        } catch (error) {
            alert("حدث خطأ: " + error.message);
        }
    };
</script>
</head><body><header>
    <h1>Nova Future</h1>
    <p>إنشاء حساب جديد</p>
</header>

<main>
    <section>
        <h2>إنشاء حساب 🚀</h2>

        <form onsubmit="createAccount(event)">
    <input type="text" placeholder="الاسم بالكامل" required>
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة المرور" required>
    <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>

    <button type="submit">إنشاء الحساب</button>
</form>

        <p>
            لديك حساب بالفعل؟
            <a href="login.html">تسجيل الدخول</a>
        </p>

        <a href="../index.html">العودة للرئيسية</a>
    </section>
</main>

<script src="../js/app.js"></script>

</body>
</html>
