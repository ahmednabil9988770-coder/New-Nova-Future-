<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><meta
    name="description"
    content="إدارة الملف الشخصي في منصة Nova Future التعليمية."
>

<title>الملف الشخصي - Nova Future</title>

<link rel="stylesheet" href="../css/style.css">

<style>
    /* ========================================
       Nova Future - Profile Page
    ======================================== */

    .profile-page {
        min-height: 100vh;
        background:
            radial-gradient(
                circle at top right,
                var(--primary-light),
                transparent 32%
            ),
            var(--bg-color);
    }

    .profile-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--surface-color);
        border-bottom: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
    }

    .profile-header-inner {
        width: min(1100px, calc(100% - 32px));
        min-height: 72px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--text-color);
        text-decoration: none;
        font-size: 20px;
        font-weight: 800;
    }

    .brand-icon {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--primary-color);
        color: #fff;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 9px 16px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background: var(--surface-color);
        color: var(--text-color);
        text-decoration: none;
        font-weight: 700;
        transition:
            background var(--transition),
            color var(--transition),
            border-color var(--transition),
            transform var(--transition);
    }

    .back-btn:hover {
        background: var(--primary-light);
        color: var(--primary-color);
        border-color: var(--primary-color);
        transform: translateY(-1px);
    }

    .profile-main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 70px;
    }

    .page-heading {
        margin-bottom: 24px;
    }

    .page-heading .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 9px;
        color: var(--primary-color);
        font-size: 14px;
        font-weight: 800;
    }

    .page-heading h1 {
        margin: 0 0 8px;
        color: var(--text-color);
        font-size: clamp(26px, 4vw, 34px);
        line-height: 1.3;
    }

    .page-heading p {
        margin: 0;
        color: var(--muted-text);
        line-height: 1.8;
    }

    .profile-card {
        position: relative;
        overflow: hidden;
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
    }

    .profile-card::before {
        content: "";
        display: block;
        height: 5px;
        background: linear-gradient(
            90deg,
            var(--primary-color),
            var(--primary-dark)
        );
    }

    .profile-content {
        padding: 34px;
    }

    .profile-intro {
        display: flex;
        align-items: center;
        gap: 20px;
        padding-bottom: 28px;
        margin-bottom: 28px;
        border-bottom: 1px solid var(--border-color);
    }

    .avatar {
        flex: 0 0 auto;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--primary-light);
        color: var(--primary-color);
        border: 4px solid var(--surface-color);
        outline: 1px solid var(--border-color);
        font-size: 34px;
        font-weight: 800;
        user-select: none;
    }

    .profile-intro-text {
        min-width: 0;
    }

    .profile-intro-text h2 {
        margin: 0 0 6px;
        color: var(--text-color);
        font-size: 24px;
        overflow-wrap: anywhere;
    }

    .profile-intro-text p {
        margin: 0;
        color: var(--muted-text);
        overflow-wrap: anywhere;
    }

    .profile-form {
        display: grid;
        gap: 22px;
    }

    .field {
        display: grid;
        gap: 8px;
    }

    .field label {
        color: var(--text-color);
        font-size: 14px;
        font-weight: 800;
    }

    .field input {
        width: 100%;
    }

    .field input[readonly] {
        background: var(--bg-color);
        color: var(--muted-text);
        cursor: not-allowed;
    }

    .field-hint {
        margin: 0;
        color: var(--muted-text);
        font-size: 12px;
        line-height: 1.6;
    }

    .role-box {
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 12px 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background: var(--primary-light);
        color: var(--primary-color);
        font-weight: 800;
    }

    .role-icon {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--surface-color);
    }

    .save-btn {
        width: 100%;
        min-height: 50px;
        margin-top: 4px;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--primary-color);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition:
            background var(--transition),
            transform var(--transition),
            box-shadow var(--transition);
    }

    .save-btn:hover:not(:disabled) {
        background: var(--primary-dark);
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(37, 99, 235, 0.22);
    }

    .save-btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
    }

    .button-content {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
    }

    .button-spinner {
        width: 17px;
        height: 17px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: profileSpin 0.75s linear infinite;
    }

    .page-message {
        display: none;
        margin-top: 16px;
        padding: 13px 15px;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.7;
    }

    .page-message.show {
        display: block;
    }

    .page-message.success {
        background: var(--success-bg);
        color: var(--success-color);
        border: 1px solid rgba(22, 163, 74, 0.18);
    }

    .page-message.error {
        background: var(--danger-bg);
        color: var(--danger-color);
        border: 1px solid rgba(220, 38, 38, 0.18);
    }

    .page-message.info {
        background: var(--primary-light);
        color: var(--primary-color);
        border: 1px solid rgba(37, 99, 235, 0.18);
    }

    .loading-state {
        display: flex;
        min-height: 280px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        color: var(--muted-text);
        text-align: center;
    }

    .loading-spinner {
        width: 38px;
        height: 38px;
        border: 4px solid var(--primary-light);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: profileSpin 0.8s linear infinite;
    }

    .loading-state p {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
    }

    .profile-footer-note {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 22px;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background: var(--bg-color);
        color: var(--muted-text);
        font-size: 13px;
        line-height: 1.8;
    }

    .profile-footer-note span:first-child {
        flex: 0 0 auto;
    }

    @keyframes profileSpin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (max-width: 640px) {
        .profile-header-inner {
            width: min(100% - 24px, 1100px);
            min-height: 64px;
        }

        .brand {
            font-size: 17px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
        }

        .back-btn {
            min-height: 38px;
            padding: 8px 11px;
            font-size: 13px;
        }

        .profile-main {
            width: min(100% - 24px, 760px);
            padding: 30px 0 45px;
        }

        .page-heading {
            margin-bottom: 18px;
        }

        .profile-content {
            padding: 22px 18px;
        }

        .profile-intro {
            flex-direction: column;
            text-align: center;
            padding-bottom: 22px;
            margin-bottom: 22px;
        }

        .avatar {
            width: 82px;
            height: 82px;
            font-size: 30px;
        }

        .profile-intro-text h2 {
            font-size: 21px;
        }

        .profile-form {
            gap: 18px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .button-spinner,
        .loading-spinner {
            animation: none;
        }

        .back-btn,
        .save-btn {
            transition: none;
        }
    }
</style>

</head><body><div class="profile-page">

    <header class="profile-header">
        <div class="profile-header-inner">

            <a href="../index.html" class="brand" aria-label="Nova Future - الصفحة الرئيسية">
                <span class="brand-icon" aria-hidden="true">🚀</span>
                <span>Nova Future</span>
            </a>

            <a
                href="../index.html"
                class="back-btn"
                id="backBtn"
            >
                <span aria-hidden="true">←</span>
                <span>العودة</span>
            </a>

        </div>
    </header>


    <main class="profile-main">

        <div class="page-heading">
            <div class="eyebrow">
                <span aria-hidden="true">👤</span>
                حسابك الشخصي
            </div>

            <h1>الملف الشخصي</h1>

            <p>
                راجع بيانات حسابك وعدّل اسمك بسهولة.
            </p>
        </div>


        <section
            class="profile-card"
            aria-label="بيانات الملف الشخصي"
        >

            <div
                class="loading-state"
                id="loading"
                role="status"
                aria-live="polite"
            >
                <div
                    class="loading-spinner"
                    aria-hidden="true"
                ></div>

                <p>جاري تحميل الملف الشخصي...</p>
            </div>


            <div
                class="profile-content"
                id="profileCard"
                hidden
            >

                <div class="profile-intro">

                    <div
                        class="avatar"
                        id="avatar"
                        aria-hidden="true"
                    >
                        👤
                    </div>

                    <div class="profile-intro-text">

                        <h2 id="profileName">
                            مستخدم
                        </h2>

                        <p id="profileEmail">
                            -
                        </p>

                    </div>

                </div>


                <div class="profile-form">

                    <div class="field">

                        <label for="name">
                            الاسم
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="اكتب اسمك"
                            autocomplete="name"
                            maxlength="100"
                            required
                        >

                        <p class="field-hint">
                            يمكنك تعديل الاسم الظاهر داخل المنصة.
                        </p>

                    </div>


                    <div class="field">

                        <label for="email">
                            البريد الإلكتروني
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            readonly
                            aria-readonly="true"
                            autocomplete="email"
                        >

                        <p class="field-hint">
                            البريد الإلكتروني مرتبط بحسابك ولا يمكن تعديله من هنا.
                        </p>

                    </div>


                    <div class="field">

                        <label>
                            نوع الحساب
                        </label>

                        <div
                            class="role-box"
                            id="role"
                            aria-live="polite"
                        >
                            <span
                                class="role-icon"
                                aria-hidden="true"
                            >
                                👤
                            </span>

                            <span>-</span>
                        </div>

                    </div>


                    <button
                        type="button"
                        class="save-btn"
                        id="saveBtn"
                    >
                        <span class="button-content" id="saveButtonContent">
                            <span aria-hidden="true">💾</span>
                            <span>حفظ التغييرات</span>
                        </span>
                    </button>

                </div>


                <div
                    class="page-message"
                    id="message"
                    role="status"
                    aria-live="polite"
                ></div>


                <div class="profile-footer-note">
                    <span aria-hidden="true">🔒</span>

                    <span>
                        بيانات حسابك محفوظة بشكل آمن، ويمكنك تعديل اسمك في أي وقت.
                    </span>
                </div>

            </div>

        </section>

    </main>

</div>


<script type="module">

    import {
        auth,
        db
    } from "../js/firebase-config.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
        doc,
        getDoc,
        updateDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    const loading =
        document.getElementById("loading");

    const profileCard =
        document.getElementById("profileCard");

    const profileName =
        document.getElementById("profileName");

    const profileEmail =
        document.getElementById("profileEmail");

    const nameInput =
        document.getElementById("name");

    const emailInput =
        document.getElementById("email");

    const roleBox =
        document.getElementById("role");

    const avatar =
        document.getElementById("avatar");

    const saveBtn =
        document.getElementById("saveBtn");

    const saveButtonContent =
        document.getElementById("saveButtonContent");

    const message =
        document.getElementById("message");

    const backBtn =
        document.getElementById("backBtn");


    let currentUser = null;


    function showMessage(text, type = "info") {

        message.textContent = text;

        message.className =
            "page-message show " + type;

    }


    function clearMessage() {

        message.textContent = "";

        message.className =
            "page-message";

    }


    function getRoleName(role) {

        if (role === "student") {
            return "طالب";
        }

        if (role === "teacher") {
            return "مدرس";
        }

        if (role === "admin") {
            return "مدير";
        }

        return "مستخدم";

    }


    function getRoleIcon(role) {

        if (role === "student") {
            return "🎓";
        }

        if (role === "teacher") {
            return "👨‍🏫";
        }

        if (role === "admin") {
            return "🛡️";
        }

        return "👤";

    }


    function updateAvatar(name) {

        const cleanName =
            (name || "").trim();

        const firstLetter =
            cleanName.charAt(0);

        avatar.textContent =
            firstLetter || "👤";

    }


    function setBackButton(role) {

        if (role === "student") {

            backBtn.href =
                "student.html";

            return;
        }

        if (role === "teacher") {

            backBtn.href =
                "teacher.html";

            return;
        }

        if (role === "admin") {

            backBtn.href =
                "admin.html";

            return;
        }

        backBtn.href =
            "../index.html";

    }


    function setSaveLoading(isLoading) {

        saveBtn.disabled =
            isLoading;

        if (isLoading) {

            saveButtonContent.innerHTML = `
                <span
                    class="button-spinner"
                    aria-hidden="true"
                ></span>
                <span>جاري الحفظ...</span>
            `;

        } else {

            saveButtonContent.innerHTML = `
                <span aria-hidden="true">💾</span>
                <span>حفظ التغييرات</span>
            `;

        }

    }


    function showProfile() {

        loading.hidden =
            true;

        profileCard.hidden =
            false;

    }


    function showLoading() {

        loading.hidden =
            false;

        profileCard.hidden =
            true;

    }


    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            currentUser =
                user;


            try {

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnap =
                    await getDoc(userRef);


                if (!userSnap.exists()) {

                    showProfile();

                    showMessage(
                        "لم يتم العثور على بيانات الحساب في قاعدة البيانات.",
                        "error"
                    );

                    return;

                }


                const userData =
                    userSnap.data();


                const name =
                    userData.name ||
                    "مستخدم";


                const email =
                    userData.email ||
                    user.email ||
                    "";


                const role =
                    userData.role ||
                    "student";


                profileName.textContent =
                    name;

                profileEmail.textContent =
                    email;

                nameInput.value =
                    name;

                emailInput.value =
                    email;


                roleBox.innerHTML = `
                    <span
                        class="role-icon"
                        aria-hidden="true"
                    >
                        ${getRoleIcon(role)}
                    </span>

                    <span>
                        ${getRoleName(role)}
                    </span>
                `;


                updateAvatar(name);

                setBackButton(role);

                showProfile();

            } catch (error) {

                console.error(
                    "PROFILE LOAD ERROR:",
                    error
                );

                showProfile();

                showMessage(
                    "حدث خطأ أثناء تحميل الملف الشخصي. حاول تحديث الصفحة.",
                    "error"
                );

            }

        }
    );


    nameInput.addEventListener(
        "input",
        () => {

            const newName =
                nameInput.value.trim();


            profileName.textContent =
                newName || "مستخدم";


            updateAvatar(
                newName
            );


            if (message.classList.contains("show")) {
                clearMessage();
            }

        }
    );


    saveBtn.addEventListener(
        "click",
        async () => {

            if (!currentUser) {
                return;
            }


            const newName =
                nameInput.value.trim();


            if (!newName) {

                showMessage(
                    "من فضلك اكتب اسمك.",
                    "error"
                );

                nameInput.focus();

                return;

            }


            if (newName.length < 2) {

                showMessage(
                    "الاسم يجب أن يحتوي على حرفين على الأقل.",
                    "error"
                );

                nameInput.focus();

                return;

            }


            if (newName.length > 100) {

                showMessage(
                    "الاسم طويل جدًا. اختر اسمًا أقصر.",
                    "error"
                );

                nameInput.focus();

                return;

            }


            setSaveLoading(true);

            clearMessage();


            try {

                const userRef =
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    );


                await updateDoc(
                    userRef,
                    {
                        name: newName
                    }
                );


                profileName.textContent =
                    newName;


                updateAvatar(
                    newName
                );


                showMessage(
                    "تم حفظ التغييرات بنجاح ✅",
                    "success"
                );

            } catch (error) {

                console.error(
                    "PROFILE UPDATE ERROR:",
                    error
                );


                showMessage(
                    "حدث خطأ أثناء حفظ البيانات. حاول مرة أخرى.",
                    "error"
                );

            } finally {

                setSaveLoading(false);

            }

        }
    );

</script>

<script src="../js/app.js"></script>

</body>
</html>
