<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEVEL 0 — CLASSIFIED</title>

    <link
        rel="stylesheet"
        href="../css/level0.css"
    >
</head>

<body>

    <div id="level0App">

        <!-- STORY -->
        <section id="level0Story" hidden>

            <div class="level0-card">

                <div id="level0SceneNumber">
                    LEVEL 0
                </div>

                <div id="level0StoryIcon">
                    🌙
                </div>

                <h1 id="level0StoryTitle">
                    LEVEL 0 — CLASSIFIED
                </h1>

                <p id="level0StoryText">
                    جاري تحميل المهمة...
                </p>

                <button
                    id="level0NextBtn"
                    type="button"
                >
                    التالي →
                </button>

            </div>

        </section>


        <!-- INVESTIGATION -->
        <section id="level0Investigation" hidden>

            <div class="level0-card">

                <div class="level0-icon">
                    🕵️
                </div>

                <h1>
                    عملية استعادة الشخصية
                </h1>

                <p>
                    شخصيتك اختفت...
                    <br>
                    دورك الآن أن تعرف أين ذهبت.
                </p>

                <div id="level0Clues">
                    🔎 الأدلة المكتشفة:
                    <strong id="level0ClueCount">0</strong>
                </div>

                <div id="level0Locations">

                    <button
                        class="level0-location"
                        data-location="dashboard"
                        type="button"
                    >
                        <span class="location-icon">💻</span>
                        <span>لوحة الطالب</span>
                    </button>

                    <button
                        class="level0-location"
                        data-location="library"
                        type="button"
                    >
                        <span class="location-icon">📚</span>
                        <span>المكتبة</span>
                    </button>

                    <button
                        class="level0-location"
                        data-location="terminal"
                        type="button"
                    >
                        <span class="location-icon">🖥️</span>
                        <span>المحطة السرية</span>
                    </button>

                </div>

                <div id="level0Puzzle" hidden>

                    <h2>
                        🔐 الملف السري
                    </h2>

                    <p>
                        لديك ثلاثة أدلة.
                        <br>
                        ما هو الرمز الصحيح؟
                    </p>

                    <div id="level0PuzzleOptions">

                        <button
                            type="button"
                            data-answer="47-NF"
                        >
                            47-NF
                        </button>

                        <button
                            type="button"
                            data-answer="NF-07"
                        >
                            NF-07
                        </button>

                        <button
                            type="button"
                            data-answer="11-07"
                        >
                            11-07
                        </button>

                    </div>

                </div>

                <div id="level0InvestigationMessage"></div>

            </div>

        </section>


        <!-- COMPLETE -->
        <section id="level0Complete" hidden>

            <div class="level0-card">

                <div class="level0-icon">
                    🏆
                </div>

                <h1>
                    المهمة اكتملت!
                </h1>

                <p>
                    لقد نجحت في استعادة شخصيتك.
                </p>

                <div id="level0Reward">
                    🏆 محقق نوفا
                    <br>
                    ⭐ +50 XP
                </div>

                <button
                    id="level0BackBtn"
                    type="button"
                >
                    العودة إلى المنصة
                </button>

            </div>

        </section>

    </div>


    <script
        type="module"
        src="../js/level0.js"
    ></script>

</body>

</html>
