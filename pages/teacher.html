<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة المدرّس - Nova Future</title>

    <link rel="stylesheet" href="../css/style.css">

    <script type="module">
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { auth, db } from "../js/firebase-config.js";


        // تسجيل الخروج
        window.logoutTeacher = async function () {

            try {

                await signOut(auth);

                window.location.href = "login.html";

            } catch (error) {

                console.error(error);

                alert("حدث خطأ أثناء تسجيل الخروج ❌");
            }
        };


        // التحقق من صلاحية المدرس
        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href = "login.html";

                return;
            }

            try {

                const userDoc = await getDoc(
                    doc(db, "users", user.uid)
                );


                if (!userDoc.exists()) {

                    alert("بيانات المستخدم غير موجودة ❌");

                    window.location.href = "login.html";

                    return;
                }


                const userData = userDoc.data();


                if (userData.role !== "teacher") {

                    alert("ليس لديك صلاحية لدخول لوحة المدرّس ❌");

                    if (userData.role === "admin") {

                        window.location.href = "admin.html";

                    } else if (userData.role === "student") {

                        window.location.href = "student.html";

                    } else {

                        window.location.href = "login.html";
                    }

                }

            } catch (error) {

                console.error(error);

                alert("حدث خطأ أثناء التحقق من الصلاحيات ❌");

                window.location.href = "login.html";
            }

        });

    </script>
</head>


<body>

    <header>

        <h1>Nova Future</h1>

        <p>لوحة المدرّس</p>

    </header>


    <main>

        <section>

            <h2>مرحبًا بك أيها المدرّس 👋</h2>

            <p>
                من هنا تقدر تدير المحتوى والطلاب والامتحانات.
            </p>

            <button onclick="logoutTeacher()">
                تسجيل الخروج 🚪
            </button>

        </section>


        <section>

            <h2>الدورات 📚</h2>

            <p>
                إضافة وتعديل الدورات التعليمية.
            </p>

        </section>


        <section>

            <h2>الطلاب 👨‍🎓</h2>

            <p>
                عرض ومتابعة الطلاب المسجلين.
            </p>

        </section>


        <section>

            <h2>الامتحانات 📝</h2>

            <p>
                إنشاء وتعديل وإدارة الامتحانات.
            </p>

        </section>


        <section>

            <h2>النتائج 📊</h2>

            <p>
                متابعة نتائج الطلاب ودرجاتهم.
            </p>

        </section>


        <section>

            <a href="../index.html">
                العودة للرئيسية
            </a>

        </section>

    </main>


    <script src="../js/app.js"></script>

</body>
</html>
