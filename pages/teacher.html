<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة المدرس - Nova Future</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .dashboard {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .top-bar {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .top-bar h2 {
            margin: 0 0 8px;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .card {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .card h3 {
            margin-bottom: 20px;
        }

        .item {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .item h4 {
            margin-bottom: 8px;
        }

        .item p {
            margin-bottom: 8px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .primary-btn {
            border: none;
            background: #222;
            color: white;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        .success {
            color: #15803d;
            margin-top: 10px;
        }

        .error {
            color: #dc2626;
            margin-top: 10px;
        }
    </style>

    <script type="module">

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            doc,
            getDoc,
            collection,
            getDocs,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        import { auth, db } from "../js/firebase-config.js";


        // =====================================
        // تسجيل الخروج
        // =====================================

        window.logoutTeacher = async function() {

            await signOut(auth);

            window.location.href = "login.html";
        };


        // =====================================
        // تحميل الكورسات
        // =====================================

        async function loadCourses() {

            const coursesList =
                document.getElementById("coursesList");

            const lessonCourse =
                document.getElementById("lessonCourse");

            coursesList.innerHTML = "";

            lessonCourse.innerHTML =
                '<option value="">اختر الكورس</option>';

            try {

                const snapshot =
                    await getDocs(
                        collection(db, "courses")
                    );

                if (snapshot.empty) {

                    coursesList.innerHTML =
                        '<p class="empty">لا توجد كورسات حاليًا.</p>';

                    return;
                }

                snapshot.forEach((courseDoc) => {

                    const course =
                        courseDoc.data();

                    // عرض الكورس

                    const div =
                        document.createElement("div");

                    div.className = "item";

                    div.innerHTML = `
                        <h4>
                            ${course.name || "بدون اسم"}
                        </h4>

                        <p>
                            ${course.description || "لا يوجد وصف."}
                        </p>
                    `;

                    coursesList.appendChild(div);


                    // إضافة الكورس للقائمة

                    const option =
                        document.createElement("option");

                    option.value =
                        course.name || "";

                    option.textContent =
                        course.name || "بدون اسم";

                    lessonCourse.appendChild(option);
                });

            } catch (error) {

                console.error(error);

                coursesList.innerHTML =
                    '<p class="error">حدث خطأ أثناء تحميل الكورسات.</p>';
            }
        }


        // =====================================
        // تحميل الدروس
        // =====================================

        async function loadLessons() {

            const lessonsList =
                document.getElementById("lessonsList");

            lessonsList.innerHTML = "";

            try {

                const snapshot =
                    await getDocs(
                        collection(db, "lessons")
                    );

                if (snapshot.empty) {

                    lessonsList.innerHTML =
                        '<p class="empty">لا توجد دروس حاليًا.</p>';

                    return;
                }

                snapshot.forEach((lessonDoc) => {

                    const lesson =
                        lessonDoc.data();

                    const div =
                        document.createElement("div");

                    div.className = "item";

                    div.innerHTML = `
                        <h4>
                            ${lesson.title || "درس بدون عنوان"}
                        </h4>

                        <p>
                            <strong>الكورس:</strong>
                            ${lesson.courseName || "غير محدد"}
                        </p>

                        <p>
                            ${lesson.content || ""}
                        </p>

                        <p>
                            <strong>المدرس:</strong>
                            ${lesson.teacherId || "غير معروف"}
                        </p>
                    `;

                    lessonsList.appendChild(div);
                });

            } catch (error) {

                console.error(error);

                lessonsList.innerHTML =
                    '<p class="error">حدث خطأ أثناء تحميل الدروس.</p>';
            }
        }


        // =====================================
        // إضافة درس
        // =====================================

        window.addLesson = async function(event) {

            event.preventDefault();

            const courseName =
                document.getElementById("lessonCourse").value;

            const title =
                document.getElementById("lessonTitle")
                    .value.trim();

            const content =
                document.getElementById("lessonContent")
                    .value.trim();

            const message =
                document.getElementById("lessonMessage");


            if (!courseName) {

                message.textContent =
                    "من فضلك اختر الكورس.";

                message.className = "error";

                return;
            }


            if (!title || !content) {

                message.textContent =
                    "من فضلك اكتب عنوان الدرس ومحتواه.";

                message.className = "error";

                return;
            }


            try {

                await addDoc(
                    collection(db, "lessons"),
                    {
                        courseName: courseName,
                        title: title,
                        content: content,
                        teacherId: auth.currentUser.uid,
                        createdAt: serverTimestamp()
                    }
                );


                message.textContent =
                    "تم إضافة الدرس بنجاح ✅";

                message.className = "success";


                document.getElementById("lessonForm")
                    .reset();


                await loadLessons();

            } catch (error) {

                console.error(error);

                message.textContent =
                    "حدث خطأ أثناء إضافة الدرس ❌";

                message.className = "error";
            }
        };


        // =====================================
        // التحقق من حساب المدرس
        // =====================================

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }


            try {

                const userDoc =
                    await getDoc(
                        doc(db, "users", user.uid)
                    );


                if (!userDoc.exists()) {

                    await signOut(auth);

                    window.location.href =
                        "login.html";

                    return;
                }


                const userData =
                    userDoc.data();


                // منع الدخول لغير المدرس

                if (userData.role !== "teacher") {

                    if (userData.role === "admin") {

                        window.location.href =
                            "admin.html";

                    } else if (userData.role === "student") {

                        window.location.href =
                            "student.html";

                    } else {

                        await signOut(auth);

                        window.location.href =
                            "login.html";
                    }

                    return;
                }


                // اسم المدرس

                document.getElementById("teacherName")
                    .textContent =
                    userData.name || "المدرس";


                await loadCourses();

                await loadLessons();

            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء تحميل بيانات المدرس."
                );
            }
        });

    </script>
</head>


<body>

    <header>

        <h1>Nova Future 🚀</h1>

        <p>
            لوحة المدرس
        </p>

    </header>


    <main class="dashboard">


        <!-- ================================= -->
        <!-- الترحيب -->
        <!-- ================================= -->

        <div class="top-bar">

            <div>

                <h2>
                    أهلاً بك يا
                    <span id="teacherName">...</span>
                    👨‍🏫
                </h2>

                <p>
                    إدارة الدروس والمحتوى التعليمي.
                </p>

            </div>


            <button
                class="logout-btn"
                onclick="logoutTeacher()"
            >
                تسجيل الخروج
            </button>

        </div>


        <!-- ================================= -->
        <!-- الكورسات -->
        <!-- ================================= -->

        <div class="card">

            <h3>
                📚 الكورسات
            </h3>

            <div id="coursesList">

                <p class="empty">
                    جاري تحميل الكورسات...
                </p>

            </div>

        </div>


        <!-- ================================= -->
        <!-- إضافة درس -->
        <!-- ================================= -->

        <div class="card">

            <h3>
                ➕ إضافة درس جديد
            </h3>


            <form
                id="lessonForm"
                onsubmit="addLesson(event)"
            >

                <select
                    id="lessonCourse"
                    required
                >

                    <option value="">
                        جاري تحميل الكورسات...
                    </option>

                </select>


                <input
                    type="text"
                    id="lessonTitle"
                    placeholder="عنوان الدرس"
                    required
                >


                <textarea
                    id="lessonContent"
                    placeholder="اكتب محتوى الدرس هنا..."
                    required
                ></textarea>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    إضافة الدرس 📖
                </button>


                <p
                    id="lessonMessage"
                ></p>

            </form>

        </div>


        <!-- ================================= -->
        <!-- الدروس -->
        <!-- ================================= -->

        <div class="card">

            <h3>
                📖 الدروس الموجودة
            </h3>


            <div id="lessonsList">

                <p class="empty">
                    جاري تحميل الدروس...
                </p>

            </div>

        </div>


        <!-- ================================= -->
        <!-- الطلاب -->
        <!-- ================================= -->

        <div class="card">

            <h3>
                👨‍🎓 الطلاب
            </h3>

            <p class="empty">
                قسم الطلاب سيتم تطويره لاحقًا.
            </p>

        </div>


        <!-- ================================= -->
        <!-- النتائج -->
        <!-- ================================= -->

        <div class="card">

            <h3>
                📊 نتائج الطلاب
            </h3>

            <p class="empty">
                قسم النتائج سيتم تطويره لاحقًا.
            </p>

        </div>


    </main>


    <footer>

        <p>
            © 2026 Nova Future
        </p>

    </footer>


    <script src="../js/app.js"></script>

</body>
</html>
