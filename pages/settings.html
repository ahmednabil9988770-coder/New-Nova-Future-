<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Future - الإعدادات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --background-color: #f4f7fb;
            --surface-color: #ffffff;
            --text-color: #222222;
            --border-color: #e5e7eb;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            transition: 0.2s ease;
        }

        .topbar {
            background: var(--primary-dark);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 15px;
        }

        .card {
            background: var(--surface-color);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        h2 {
            margin-top: 0;
        }

        .colors {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .color {
            height: 55px;
            border-radius: 10px;
            border: 3px solid transparent;
            cursor: pointer;
        }

        .color.active {
            border-color: var(--text-color);
        }

        .blue { background: #2563eb; }
        .purple { background: #7c3aed; }
        .green { background: #16a34a; }
        .red { background: #dc2626; }
        .orange { background: #ea580c; }

        button,
        a {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        .primary {
            background: var(--primary-color);
            color: white;
        }

        .back {
            background: #374151;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        body.dark {
            --background-color: #111827;
            --surface-color: #1f2937;
            --text-color: #f9fafb;
            --border-color: #374151;
        }

        @media (max-width: 600px) {
            .colors {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="logo">🚀 Nova Future</div>
    </div>

    <div class="container">

        <div class="card">
            <h2>⚙️ الإعدادات</h2>
            <p>تحكم في شكل المنصة والإعدادات العامة.</p>
        </div>

        <div class="card">

            <h2>🎨 لون المنصة</h2>

            <div class="colors">

                <button class="color blue"
                    data-color="#2563eb"
                    data-dark="#1d4ed8"></button>

                <button class="color purple"
                    data-color="#7c3aed"
                    data-dark="#6d28d9"></button>

                <button class="color green"
                    data-color="#16a34a"
                    data-dark="#15803d"></button>

                <button class="color red"
                    data-color="#dc2626"
                    data-dark="#b91c1c"></button>

                <button class="color orange"
                    data-color="#ea580c"
                    data-dark="#c2410c"></button>

            </div>

        </div>

        <div class="card">

            <h2>🌙 المظهر</h2>

            <div class="buttons">

                <button class="primary" id="lightBtn">
                    ☀️ الوضع الفاتح
                </button>

                <button class="primary" id="darkBtn">
                    🌙 الوضع الداكن
                </button>

            </div>

        </div>

        <div class="card">

            <div class="buttons">

                <button class="back" id="backBtn">
                    ↩️ رجوع
                </button>

                <button class="danger" id="resetBtn">
                    🔄 إعادة الإعدادات
                </button>

            </div>

        </div>

    </div>

<script type="module">

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    auth,
    db
} from "../js/firebase-config.js";


/* =========================
   APPLY SETTINGS
========================= */

function applySettings() {

    const color =
        localStorage.getItem("novaPrimaryColor") ||
        "#2563eb";

    const darkColor =
        localStorage.getItem("novaPrimaryDarkColor") ||
        "#1d4ed8";

    const theme =
        localStorage.getItem("novaTheme") ||
        "light";

    document.documentElement.style.setProperty(
        "--primary-color",
        color
    );

    document.documentElement.style.setProperty(
        "--primary-dark",
        darkColor
    );

    if (theme === "dark") {
        document.body.classList.add("dark");
    } else {
        document.body.classList.remove("dark");
    }

    document.querySelectorAll(".color").forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.color === color
        );

    });
}


/* =========================
   COLOR
========================= */

document.querySelectorAll(".color").forEach(button => {

    button.addEventListener("click", () => {

        localStorage.setItem(
            "novaPrimaryColor",
            button.dataset.color
        );

        localStorage.setItem(
            "novaPrimaryDarkColor",
            button.dataset.dark
        );

        applySettings();

    });

});


/* =========================
   THEME
========================= */

document
    .getElementById("lightBtn")
    .addEventListener("click", () => {

        localStorage.setItem(
            "novaTheme",
            "light"
        );

        applySettings();

    });


document
    .getElementById("darkBtn")
    .addEventListener("click", () => {

        localStorage.setItem(
            "novaTheme",
            "dark"
        );

        applySettings();

    });


/* =========================
   RESET
========================= */

document
    .getElementById("resetBtn")
    .addEventListener("click", () => {

        localStorage.removeItem(
            "novaPrimaryColor"
        );

        localStorage.removeItem(
            "novaPrimaryDarkColor"
        );

        localStorage.removeItem(
            "novaTheme"
        );

        applySettings();

    });


/* =========================
   BACK
========================= */

document
    .getElementById("backBtn")
    .addEventListener("click", async () => {

        const user = auth.currentUser;

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        try {

            const snap =
                await getDoc(
                    doc(db, "users", user.uid)
                );

            if (!snap.exists()) {
                window.location.href = "login.html";
                return;
            }

            const role = snap.data().role;

            if (role === "teacher") {
                window.location.href = "teacher.html";
            }
            else if (role === "admin") {
                window.location.href = "admin.html";
            }
            else {
                window.location.href = "student.html";
            }

        } catch (error) {

            console.error(error);

            window.location.href = "login.html";

        }

    });


/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "login.html";
    }

});


applySettings();

</script>

<script src="../js/app.js"></script>

</body>
</html>
